<title>Court of Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-screen 3D courtroom. The only UI is the prompt dock, speech bubbles, and an adjourn button. Single dark look by choice. */
:root {
  --night: #1a130e;
  --paper: #fffaf1;
  --ink: #2a1c12;
  --for: #2f9e7e;
  --against: #d1495b;
  --judge: #c8952e;
  --witness: #7b61c9;
  --ui: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
#game { position: absolute; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }

.bubble {
  position: absolute; left: 0; top: 0; z-index: 5; width: max-content; max-width: min(440px, calc(100vw - 32px));
  background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 18px 20px 20px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .3); font-size: 17px; line-height: 1.42; pointer-events: none;
}
.bubble[hidden] { display: none !important; }
.bubble.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.who {
  position: absolute; top: -15px; left: 16px; background: var(--who, var(--judge)); color: #fff; border: 2.5px solid var(--ink);
  border-radius: 999px; padding: 1px 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.txt { max-height: 38vh; overflow-y: auto; white-space: pre-wrap; min-width: 60px; }
.txt.wait { display: flex; gap: 6px; padding: 6px 4px; }
.txt.wait i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); opacity: .3; animation: think 1s infinite; }
.txt.wait i:nth-child(2) { animation-delay: .15s; } .txt.wait i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 50% { opacity: 1; transform: translateY(-4px); } }
.next { position: absolute; right: 12px; bottom: 6px; width: 0; height: 0; border-left: 10px solid var(--ink); border-top: 7px solid transparent; border-bottom: 7px solid transparent; animation: nudge .7s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.tail { position: absolute; bottom: -13px; width: 22px; height: 22px; margin-left: -11px; background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }

#tapHint { position: absolute; left: 50%; bottom: 28px; z-index: 5; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); display: grid; place-items: center; animation: bounce 1s ease-in-out infinite; pointer-events: none; }
#tapHint::after { content: ""; border-left: 16px solid var(--ink); border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
@keyframes bounce { 50% { transform: translateY(-6px); } }

#dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 20px; }
.dock-in { display: flex; align-items: flex-end; gap: 8px; width: min(640px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 6px; box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
.field { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#idea { display: block; width: 100%; resize: none; border: 0; background: transparent; color: var(--ink); font: 500 17px/1.4 var(--ui); padding: 10px 12px; outline: none; max-height: 40vh; overflow-y: auto; }
#count { font-size: 12px; color: #8a7766; padding: 0 12px 4px; font-variant-numeric: tabular-nums; }
#count.over { color: var(--against); font-weight: 600; }
#idea::placeholder { color: #8a7766; }
.gavel-btn { flex: none; width: 52px; height: 48px; border-radius: 16px; border: 3px solid var(--ink); background: var(--judge); cursor: pointer; display: grid; place-items: center; }
.gavel-btn:active { transform: translateY(2px); }
.gavel-btn:focus-visible, #quit:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
#quit { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); cursor: pointer; display: grid; place-items: center; }

#tip { position: absolute; left: 0; top: 0; z-index: 7; max-width: min(300px, calc(100vw - 24px)); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 16px 14px 12px; font-size: 15px; line-height: 1.38; box-shadow: 0 5px 0 rgba(0, 0, 0, .3); pointer-events: none; }
#tip .who { top: -13px; left: 12px; font-size: 11.5px; }
#mute { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); cursor: pointer; display: grid; place-items: center; }
#mute .x { display: none; } #mute.off .x { display: inline; } #mute.off .w { display: none; }
#mute:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .bubble.pop, .next, #tapHint, .txt.wait i { animation: none; }
}
</style>

<div id="game"></div>
<div class="bubble" id="bubble" hidden><span class="who" id="who"></span><div class="txt" id="txt"></div><span class="next" id="next" hidden></span><span class="tail" id="tail"></span></div>
<div id="tapHint" hidden></div>
<div id="tip" hidden><span class="who" id="tipWho"></span><div id="tipTxt"></div></div>
<button id="mute" type="button" aria-label="Turn sound off">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2a1c12"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#2a1c12" stroke-width="2.2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="#2a1c12" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>
<form id="dock">
  <div class="dock-in">
    <div class="field">
      <textarea id="idea" rows="1" maxlength="70000" placeholder="An idea, or a whole case file: charges, facts, evidence, witnesses…" aria-label="Idea or case file to put on trial"></textarea>
      <span id="count" hidden></span>
    </div>
    <button class="gavel-btn" type="submit" aria-label="Start the trial">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><g fill="#2a1c12"><rect x="5" y="3" width="9" height="6" rx="1.5" transform="rotate(-45 9.5 6)"/><rect x="11" y="9" width="3" height="12" rx="1.5" transform="rotate(-45 12.5 15)"/><rect x="3" y="19" width="11" height="2.5" rx="1.2"/></g></svg>
    </button>
  </div>
</form>
<button id="quit" type="button" aria-label="Adjourn the trial" hidden>
  <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="#2a1c12" stroke-width="3" stroke-linecap="round"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Cast ---------- */
const JURORS = [
  { name: "Dolores", age: 71, job: "retired high school chemistry teacher in Ohio", voice: "You taught chemistry for 38 years. You grade arguments like lab reports: claims need evidence, and you dock points for exaggeration. Dry, stern, fair." },
  { name: "Marcus", age: 34, job: "union electrician in Philadelphia", voice: "Practical and blunt. You think about who has to do the work and what it costs regular people. You distrust ideas that sound good in a meeting but fall apart on the job." },
  { name: "Priya", age: 27, job: "UX designer in Austin", voice: "Optimistic about change. You think about how real people would experience it day to day and like concrete examples over abstractions." },
  { name: "Hank", age: 58, job: "cattle rancher in Montana", voice: "You value self-reliance and local control and you've seen grand plans from far away go sideways. Few words, plain talk, but common sense can convince you." },
  { name: "Jasmine", age: 19, job: "college sophomore in Atlanta", voice: "Idealistic, quick, online. You care about fairness and the future and get annoyed by arguments that boil down to tradition. You talk casually." },
  { name: "Samuel", age: 63, job: "Baptist pastor in Memphis", voice: "You weigh what an idea does to families, neighbors, and people who get left behind. Warm and patient, firm when people get treated like numbers." },
  { name: "Kenji", age: 45, job: "insurance actuary in Hartford", voice: "You think in probabilities, base rates, and worst cases, and you notice when an anecdote is passed off as a trend. Calm and precise." },
  { name: "Tasha", age: 39, job: "ER nurse in Chicago", voice: "You've cleaned up after plenty of bad decisions. You look for unintended harm and safety risks first. Direct, a little tired, no patience for fluff." },
  { name: "Luis", age: 50, job: "taco truck owner in Phoenix", voice: "You run a small business on thin margins. Cost, red tape, and whether this helps the little guy. Friendly and funny but you know a bad deal." },
  { name: "Margaret", age: 82, job: "former city council member in Vermont", voice: "Sixteen years on a city council. You care about process, precedent, and how things actually get implemented. Sharp and a little wry." },
  { name: "Devin", age: 31, job: "startup founder in San Francisco", voice: "You like big swings and think most institutions are too cautious. Contrarian, unimpressed by arguments that list risks without weighing upside." },
  { name: "Ruth", age: 44, job: "single mom and school bus driver in Kansas City", voice: "You raise two kids alone. Time, money, and whether this makes regular families' lives easier or harder. Grounded, honest, no patience for being talked down to." }
];

/* ---------- Three.js scene ---------- */
const T = THREE;
const CORAL = 0xd97757, INK = 0x1b1410, WHITE = 0xf7f4ee;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const host = document.getElementById("game");
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x1a130e);
scene.fog = new T.Fog(0x1a130e, 22, 40);
const camera = new T.PerspectiveCamera(45, 1, 0.1, 100);

scene.add(new T.HemisphereLight(0xfff1dc, 0x3a2516, 0.75));
const sun = new T.DirectionalLight(0xffe6c4, 0.85);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 });
scene.add(sun);
const lamp = new T.PointLight(0xffc98a, 0.5, 16);
lamp.position.set(0, 5, -4);
scene.add(lamp);

const mats = {};
const mat = (c) => mats[c] || (mats[c] = new T.MeshLambertMaterial({ color: c }));
function box(parent, w, h, d, color, x = 0, y = 0, z = 0, shadow = true) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), typeof color === "number" ? mat(color) : color);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new T.CanvasTexture(c); t.anisotropy = 4;
  return t;
}

/* Room */
const room = new T.Group(); scene.add(room);
box(room, 28, 0.2, 22, 0x8a5a36, 0, -0.1, 0).castShadow = false;
for (let x = -13; x <= 13; x += 1.3) box(room, 0.04, 0.01, 22, 0x6e4529, x, 0.005, 0, false);
box(room, 28, 2.6, 0.3, 0x5b3a26, 0, 1.3, -9);
box(room, 28, 7, 0.3, 0xe7d8bd, 0, 6.1, -9.05, false);
box(room, 28, 0.2, 0.4, 0x3f281a, 0, 2.6, -8.9);
[-13.5, 13.5].forEach((x) => { box(room, 0.3, 2.6, 22, 0x5b3a26, x, 1.3, 0); box(room, 0.3, 7, 22, 0xe7d8bd, x * 1.003, 6.1, 0, false); });
// seal
const seal = new T.Mesh(new T.CylinderGeometry(1.25, 1.25, 0.12, 40), mat(0xc8952e));
seal.rotation.x = Math.PI / 2; seal.position.set(0, 5.9, -8.85); room.add(seal);
const sealIn = new T.Mesh(new T.CylinderGeometry(0.95, 0.95, 0.14, 40), mat(0x23324d));
sealIn.rotation.x = Math.PI / 2; sealIn.position.set(0, 5.9, -8.82); room.add(sealIn);
box(room, 0.08, 0.9, 0.06, 0xc8952e, 0, 5.85, -8.72, false);
box(room, 1.1, 0.07, 0.06, 0xc8952e, 0, 6.25, -8.72, false);
[-0.45, 0.45].forEach((x) => box(room, 0.32, 0.06, 0.06, 0xc8952e, x, 5.75, -8.72, false));
// flags
const flagTex = canvasTex(192, 120, (g, w, h) => {
  for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? "#f4f1ea" : "#b22234"; g.fillRect(0, (i * h) / 13, w, h / 13 + 1); }
  g.fillStyle = "#3c3b6e"; g.fillRect(0, 0, w * 0.42, (h * 7) / 13);
  g.fillStyle = "#f4f1ea";
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { g.beginPath(); g.arc(8 + c * 13, 7 + r * 12, 2.4, 0, 7); g.fill(); }
});
[-4.6, 4.6].forEach((x) => {
  box(room, 0.08, 5.2, 0.08, 0xc8952e, x, 2.6, -8.3);
  const f = new T.Mesh(new T.PlaneGeometry(1.6, 1.0), new T.MeshLambertMaterial({ map: flagTex, side: T.DoubleSide }));
  f.position.set(x + (x < 0 ? 0.84 : -0.84), 4.55, -8.3); room.add(f);
});
// judge platform and bench
box(room, 7.4, 1.1, 2.8, 0x4a2f1f, 0, 0.55, -7.3);
box(room, 6.6, 1.75, 0.9, 0x6b4328, 0, 0.875, -5.75);
box(room, 7.0, 0.12, 1.2, 0x3f281a, 0, 1.8, -5.8);
for (let x = -2.6; x <= 2.6; x += 1.3) box(room, 1.0, 1.1, 0.04, 0x5b3a26, x, 0.9, -5.28, false);
box(room, 0.5, 0.1, 0.4, 0x3f281a, 1.1, 1.91, -5.8); // sound block
// counsel tables
const TABLES = { for: new T.Vector3(-3.2, 0, 1.0), against: new T.Vector3(3.0, 0, 1.0) };
function counselTable(p, cloth) {
  const g = new T.Group(); g.position.copy(p); room.add(g);
  box(g, 2.8, 0.12, 1.2, 0x6b4328, 0, 0.9, 0);
  [[-1.25, -0.5], [1.25, -0.5], [-1.25, 0.5], [1.25, 0.5]].forEach(([x, z]) => box(g, 0.1, 0.9, 0.1, 0x4a2f1f, x, 0.45, z));
  box(g, 2.8, 0.55, 0.05, cloth, 0, 0.6, -0.6);
  [0x2b4a7a, 0x7a2b2b, 0x3d6b3a, 0xc8952e].forEach((c, i) => box(g, 0.5, 0.1, 0.36, c, -0.8, 1.01 + i * 0.1, 0.05 * (i % 2)));
  box(g, 0.6, 0.38, 0.16, 0x3a2516, 0.9, 1.15, 0);
  return g;
}
counselTable(TABLES.for, 0x2f9e7e);
counselTable(TABLES.against, 0xd1495b);
// bar rail and gallery
box(room, 7.5, 0.9, 0.12, 0x5b3a26, -5.2, 0.45, 3.4); box(room, 7.5, 0.9, 0.12, 0x5b3a26, 5.2, 0.45, 3.4);
[4.8, 6.3, 7.8].forEach((z) => { box(room, 7, 0.45, 0.7, 0x6b4328, -5, 0.45, z); box(room, 7, 0.45, 0.7, 0x6b4328, 5, 0.45, z); box(room, 7, 0.7, 0.12, 0x5b3a26, -5, 0.9, z + 0.35); box(room, 7, 0.7, 0.12, 0x5b3a26, 5, 0.9, z + 0.35); });
// jury box
box(room, 1.4, 0.3, 8.2, 0x4a2f1f, 7.1, 0.15, -1.3);
box(room, 1.4, 0.7, 8.2, 0x3f281a, 8.5, 0.35, -1.3);
box(room, 0.15, 0.95, 8.4, 0x6b4328, 6.3, 0.475, -1.3);
box(room, 0.3, 0.08, 8.5, 0x3f281a, 6.3, 0.99, -1.3);
box(room, 3, 0.95, 0.15, 0x6b4328, 7.8, 0.475, 2.85);
// witness stand
box(room, 1.8, 0.45, 1.8, 0x4a2f1f, -4.6, 0.225, -5.1);
box(room, 1.8, 0.55, 0.1, 0x6b4328, -4.6, 0.725, -4.25);
box(room, 0.1, 0.55, 1.7, 0x6b4328, -3.75, 0.725, -5.1);
box(room, 1.9, 0.07, 0.2, 0x3f281a, -4.6, 1.03, -4.25);
box(room, 0.7, 0.5, 0.1, 0x3f281a, -4.6, 0.95, -5.85);
const WIT_STAND = new T.Vector3(-4.6, 0.45, -5.1);

/* Critters */
function critter(scale = 1) {
  const root = new T.Group(); root.scale.setScalar(scale);
  const hop = new T.Group(); root.add(hop);
  const body = new T.Group(); hop.add(body);
  const legs = [-0.36, -0.12, 0.12, 0.36].map((x) => { const l = box(hop, 0.13, 0.42, 0.16, CORAL, x, 0.21, 0); l.userData.y = 0.21; return l; });
  box(body, 1.0, 0.72, 0.62, CORAL, 0, 0.78, 0);
  const armL = new T.Group(); armL.position.set(-0.5, 0.84, 0); body.add(armL); box(armL, 0.24, 0.26, 0.3, CORAL, -0.12, 0, 0);
  const armR = new T.Group(); armR.position.set(0.5, 0.84, 0); body.add(armR); box(armR, 0.24, 0.26, 0.3, CORAL, 0.12, 0, 0);
  const eyes = new T.Group(); eyes.position.set(0, 0.84, 0.315); body.add(eyes);
  box(eyes, 0.09, 0.22, 0.02, INK, -0.2, 0, 0, false); box(eyes, 0.09, 0.22, 0.02, INK, 0.2, 0, 0, false);
  const dots = new T.Group(); root.add(dots); dots.visible = false;
  [[0.38, 1.32, 0.06], [0.55, 1.52, 0.085], [0.78, 1.8, 0.12]].forEach(([x, y, r]) => { const m = new T.Mesh(new T.SphereGeometry(r, 14, 10), mat(0xffffff)); m.position.set(x, y, 0); dots.add(m); });
  return { root, hop, body, armL, armR, eyes, legs, dots, top: 1.2 * scale, mode: "idle", phase: Math.random() * 6, face: null, walk: null, t0: 0, sign: null, signOn: false, ballot: null };
}

const PROPS = [
  (b) => { box(b, 0.36, 0.2, 0.3, 0xc8c6c2, 0, 1.24, -0.05); box(b, 0.66, 0.05, 0.03, INK, 0, 0.97, 0.33, false); [-0.33, -0.07, 0.07, 0.33].forEach((x) => box(b, 0.035, 0.27, 0.03, INK, x, 0.84, 0.33, false)); box(b, 0.66, 0.035, 0.03, INK, 0, 0.71, 0.33, false); },
  (b) => { box(b, 0.84, 0.2, 0.64, 0xf2c230, 0, 1.24, 0); box(b, 1.1, 0.05, 0.84, 0xf2c230, 0, 1.16, 0.04); box(b, 0.1, 0.22, 0.66, 0xd9a514, 0, 1.26, 0); },
  (b) => { box(b, 0.9, 0.08, 0.14, 0x7a6ae0, 0, 1.2, 0); [-1, 1].forEach((s) => { box(b, 0.08, 0.22, 0.14, 0x7a6ae0, s * 0.48, 1.1, 0); box(b, 0.12, 0.28, 0.28, 0x5a4bc0, s * 0.55, 0.96, 0); }); },
  (b) => { box(b, 0.56, 0.3, 0.5, 0x8a5a2b, 0, 1.33, 0); box(b, 0.57, 0.06, 0.51, 0x5e3b19, 0, 1.22, 0); box(b, 1.4, 0.05, 1.0, 0x8a5a2b, 0, 1.17, 0); },
  (b) => { box(b, 0.86, 0.24, 0.66, 0xe86aa6, 0, 1.24, 0); box(b, 0.88, 0.08, 0.68, 0xc94f8a, 0, 1.14, 0); box(b, 0.17, 0.17, 0.17, WHITE, 0, 1.44, 0); },
  (b) => { box(b, 1.02, 0.08, 0.64, INK, 0, 0.6, 0); box(b, 0.13, 0.08, 0.02, WHITE, 0, 0.6, 0.325, false); },
  (b) => { box(b, 0.15, 0.1, 0.03, 0x2b3f74, 0, 0.62, 0.33, false); box(b, 0.1, 0.24, 0.03, 0x2b3f74, 0, 0.47, 0.33, false); },
  (b) => { box(b, 0.5, 0.2, 0.36, WHITE, 0, 1.24, 0.05); box(b, 0.06, 0.14, 0.02, 0xd23c3c, 0, 1.24, 0.235, false); box(b, 0.15, 0.05, 0.02, 0xd23c3c, 0, 1.24, 0.235, false); },

  [judge, counsel.for, counsel.against, ...jurors, ...witnesses].forEach((c) => c && updateCritter(c, dt));
  papers.forEach((p) => {

    p.m.rotation.set(now * 2 + p.ph * 9, now * 1.3 + p.ph * 5, 0);

  if (soundOn && audio) {

/* ---------- Director ---------- */
let trialId = 0, ctl = null, phase = "home";
const dock = document.getElementById("dock"), ideaBox = document.getElementById("idea"), quitBtn = document.getElementById("quit"), countEl = document.getElementById("count");
function syncBox() {
  ideaBox.style.height = "auto";
  ideaBox.style.height = Math.min(ideaBox.scrollHeight, innerHeight * 0.4) + "px";
  const n = wordCount(ideaBox.value);
  countEl.hidden = n < 40;
  countEl.textContent = n.toLocaleString() + " / " + MAX_WORDS.toLocaleString() + " words";
  countEl.classList.toggle("over", n > MAX_WORDS);
  try { localStorage.setItem("court-idea", ideaBox.value); } catch (e) {}
}
try { const d = localStorage.getItem("court-idea"); if (d) ideaBox.value = d; } catch (e) {}
ideaBox.addEventListener("input", syncBox);
ideaBox.addEventListener("keydown", (e) => {
  const short = !ideaBox.value.includes("\n") && ideaBox.value.length < 300;
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey || (short && !e.shiftKey))) { e.preventDefault(); dock.requestSubmit(); }
});
syncBox();

function errCopy(e) {
  switch (e && e.code) {
    case "not_granted": return "Claude wasn't allowed to run here, so I can't hold this trial. Allow it and file again.";
    case "sampling_disabled": return "Claude isn't available on this account, so court can't be held.";
    case "rate_limited": return "The court is swamped. Give it a minute, then file again.";
    case "session_expired": return "Your session expired. Sign back in and refile the case.";
    case "prompt_too_large": return "That case file is too long for the court record. Trim it down and refile.";
    case "refused": return "I won't hear that one. Reword the case and file again.";
    default: return "Something went wrong with the court record. File the case again.";
  }
}

function resetCourt() {
  [counsel.for, counsel.against].forEach((c, i) => { c.walk = null; c.root.position.copy(i ? SPOT.against : SPOT.for); c.face = JUDGE_SPOT; setMode(c, "idle"); });
  jurors.forEach((c) => { c.signOn = false; c.face = JURY_LOOK; setMode(c, "idle"); });
  judge.face = new T.Vector3(0, 0, 5); setMode(judge, "idle");
  clearWitnesses();
  researching = false;
  if (typeof showTip === "function") showTip(-1);
  hush();
  closeBubble();
  advanceCb = null;
}
resetCourt();
counsel.for.root.rotation.y = counsel.against.root.rotation.y = Math.PI;
jurors.forEach((c) => { c.root.rotation.y = -Math.PI / 2; });

const PAGE_WORDS = 48;
function paginate(text) {
  const sents = text.match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)\s*/g) || (text ? [text] : []);
  const pages = []; let cur = "", n = 0;
  for (const s of sents) {
    const w = wordCount(s);
    if (cur && n + w > PAGE_WORDS) { pages.push(cur.trim()); cur = ""; n = 0; }
    cur += s; n += w;
  }
  if (cur.trim()) pages.push(cur.trim());
  return pages;
}

// Shows a line one bubble page at a time; resolves after the last page is tapped through.
async function say(c, who, color, line, P, mode = "talk") {
  let idx = 0;
  const view = {
    get text() { return paginate(line.text)[idx] || ""; },
    get done() { return line.done || paginate(line.text).length > idx + 1; }
  };
  openBubble(c, who, color, view);
  sfx.blip();
  if (c !== judge) setMode(c, mode);
  if (phase !== "jury" && phase !== "verdict") jurors.forEach((j) => { j.face = c.root.position; });
  try {
    for (;;) {
      while (!view.done) {
        if (P && P.fatal) throw P.fatal;
        await wait(120);
      }
      speak(c, view.text);
      await waitAdvance();
      hush();
      if (line.done && idx >= paginate(line.text).length - 1) break;
      idx++;
      bubble.shown = 0; bubble.lastLen = -1;
    }
  } finally {
    hush();
    if (c !== judge) setMode(c, "idle");
    closeBubble();
  }
}
async function until(P, test) {
  while (!test()) { if (P.fatal) throw P.fatal; await wait(150); }
}

async function playSpeech(P, b, chk) {
  const c = counsel[b.side];
  camTo("tables", 1.0);
  await walkTo(c, PODIUM, 1.7); chk();
  c.face = new T.Vector3(3, 0, 5);
  camTo("podium", 1.2);
  await wait(600); chk();
  await say(c, label(P, b.side), COLOR[b.side], b.line, P); chk();
  c.face = null;
  await walkTo(c, SPOT[b.side], 1.5); chk();
  c.face = JUDGE_SPOT;
}

async function playExam(P, b, chk) {
  const w = b.witness, wc = witnesses[w.idx], ex = counsel[b.examiner], opp = counsel[other(b.examiner)];
  const exLabel = label(P, b.examiner), oppLabel = label(P, other(b.examiner));
  if (b.direct) {
    camTo("tables", 1.1);
    await say(ex, exLabel, COLOR[b.examiner], mkLine(`The ${exLabel.toLowerCase()} calls ${w.name} to the stand.`), P); chk();
    camTo("exam", 1.6);
    wc.face = null;
    await walkPath(wc, toStand(wc)); chk();
    wc.face = WIT_FACE;
    setMode(wc, "oath");
    await say(judge, "The Judge", COLOR.judge, mkLine("Please raise your right hand. Do you swear to tell the truth, the whole truth, and nothing but the truth?"), P); chk();
    await say(wc, w.name, COLOR.witness, mkLine("I do."), P, "oath"); chk();
  }
  camTo("exam", 1.0);
  await walkTo(ex, PODIUM, 1.6); chk();
  ex.face = WIT_STAND;
  if (!b.turns) { setMode(ex, "think"); await until(P, () => b.turns); chk(); setMode(ex, "idle"); }
  let cut = "exam";
  const shotFor = (s) => { if (cut !== s) { camTo(s, 0.7); cut = s; } };
  for (const t of b.turns) {
    if (t.who === "Q") { shotFor("exam"); await say(ex, exLabel, COLOR[b.examiner], mkLine(t.text), P); }
    else if (t.who === "A") { shotFor("exam"); await say(wc, w.name, COLOR.witness, mkLine(t.text), P); }
    else if (t.who === "OBJECTION") { shotFor("tables"); sfx.objection(); await say(opp, oppLabel, COLOR[other(b.examiner)], mkLine(t.text), P, "object"); }
    else { shotFor("judge"); await say(judge, "The Judge", COLOR.judge, mkLine(t.text), P); }
    chk();
  }
  ex.face = null;
  camTo("exam", 0.8);
  await walkTo(ex, SPOT[b.examiner], 1.5); chk();
  ex.face = JUDGE_SPOT;
  if (!b.direct) {
    wc.face = null;
    await walkPath(wc, toSeat(wc)); chk();
    wc.face = JUDGE_SPOT;
  }
}

function showHome() {
  phase = "home";
  dock.hidden = false; quitBtn.hidden = true;
  camTo("orbit");
  syncBox();
}

async function trial(file) {
  const my = ++trialId;
  const chk = () => { if (my !== trialId) throw { code: "cancelled" }; };
  ctl = new AbortController();
  dock.hidden = true; quitBtn.hidden = false; ideaBox.blur();
  initAudio();
  resetCourt();
  let P = null;
  try {
    phase = "intro";
    camTo("judge", 1.8);
    if (!sample) {
      await wait(1200);
      await say(judge, "The Judge", COLOR.judge, mkLine("I can only hold court inside Claude. Open this page there and file your case again."));
      return;
    }
    P = startPipeline(file, ctl.signal);
    currentP = P;
    await wait(1300); chk();
    await bangGavel(3); chk();
    P.setupP.then(() => { if (my === trialId) { spawnWitnesses(P.setup); makeSignTex(P.setup.votes); } }).catch(() => {});
    await say(judge, "The Judge", COLOR.judge, P.opening, P); chk();

    phase = "research";
    camTo("tables", 1.6);
    researching = true;
    setMode(counsel.for, "research"); setMode(counsel.against, "research");
    await P.researchP.catch(() => {}); chk();
    if (P.fatal) throw P.fatal;
    researching = false;
    setMode(counsel.for, "idle"); setMode(counsel.against, "idle");
    await wait(500); chk();

    phase = "args";
    for (const b of P.beats) {
      if (b.kind === "speech") await playSpeech(P, b, chk);
      else await playExam(P, b, chk);
    }

    phase = "jury";
    const S = P.setup;
    jurors.forEach((j) => { j.face = JUDGE_SPOT; });
    camTo("judge", 1.3);
    const charge = !S.legal ? "Jurors, you've heard both sides. Cast your secret ballots."
      : S.type === "criminal" ? `Members of the jury, the prosecution must prove its case beyond a reasonable doubt. If it has, your verdict is guilty. If not, not guilty. Your verdict must be unanimous. Please cast your secret ballots.`
      : `Members of the jury, the plaintiff must prove its case by a preponderance of the evidence, meaning more likely true than not. At least nine of you must agree on the verdict. Please cast your secret ballots.`;
    await say(judge, "The Judge", COLOR.judge, mkLine(charge), P); chk();
    jurors.forEach((j) => { j.face = JURY_LOOK; });
    camTo("jury", 1.6);
    jurors.forEach((j, i) => setMode(j, P.voted[i] ? (P.votes[i] ? "sealed" : "idle") : "think"));
    await P.votesP.catch(() => {}); chk();
    if (P.fatal) throw P.fatal;
    await wait(900); chk();
    for (let i = 0; i < 12; i++) {
      const v = P.votes[i], j = jurors[i];
      if (v) { j.signFace.map = signTex[v.side]; j.signFace.needsUpdate = true; j.signOn = true; setMode(j, v.side === "for" ? "yay" : "nay"); sfx.pop(v.side); }
      await wait(reduced ? 80 : 380); chk();
    }
    await waitAdvance(); chk();

    showTip(-1);
    phase = "verdict";
    jurors.forEach((j) => { j.signOn = false; setMode(j, "lookup"); j.face = JUDGE_SPOT; });
    camTo("judge", 1.6);
    await wait(1200); chk();
    sfx.murmur();
    await bangGavel(2); chk();
    await say(judge, "The Judge", COLOR.judge, P.verdict, P); chk();
    await bangGavel(1); chk();

    camTo("wide", 2);
    const k = P.ruling.kind;
    if (k === "hung") sfx.sad(); else { sfx.fanfare(); setTimeout(sfx.cheer, 500); }
    setMode(counsel.for, k === "for" ? "cheer" : k === "against" ? "sad" : "shrug");
    setMode(counsel.against, k === "against" ? "cheer" : k === "for" ? "sad" : "shrug");
    counsel.for.face = counsel.against.face = new T.Vector3(0, 0, 12);
    jurors.forEach((j, i) => { const v = P.votes[i]; setMode(j, v && v.side === k ? "cheer" : "idle"); j.face = JURY_LOOK; });
    await wait(3200); chk();
  } catch (e) {
    if (my !== trialId || (e && e.code === "cancelled")) return;
    researching = false;
    camTo("judge", 1);
    await say(judge, "The Judge", COLOR.judge, mkLine(errCopy(e))).catch(() => {});
  } finally {
    if (my === trialId) { if (ctl) ctl.abort(); showHome(); }
  }
}

dock.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const file = ideaBox.value.trim();
  if (file.length < 4 || wordCount(file) > MAX_WORDS) { ideaBox.focus(); return; }
  trial(file);
});
quitBtn.addEventListener("click", () => {
  trialId++;
  if (ctl) ctl.abort();
  if (advanceCb) { const cb = advanceCb; advanceCb = null; cb(); }
  resetCourt();
  showHome();
});
showHome();
</script>
