<title>Court of Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-screen 3D courtroom. The only UI is the prompt dock, speech bubbles, and an adjourn button. Single dark look by choice. */
:root {
  --night: #1a130e;
  --paper: #fffaf1;
  --ink: #2a1c12;
  --for: #2f9e7e;
  --against: #d1495b;
  --judge: #c8952e;
  --ui: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
#game { position: absolute; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }

.bubble {
  position: absolute; left: 0; top: 0; z-index: 5; width: max-content; max-width: min(440px, calc(100vw - 32px));
  background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 18px 20px 20px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .3); font-size: 17px; line-height: 1.42; pointer-events: none;
}
.bubble[hidden] { display: none !important; }
.bubble.pop { animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.who {
  position: absolute; top: -15px; left: 16px; background: var(--who, var(--judge)); color: #fff; border: 2.5px solid var(--ink);
  border-radius: 999px; padding: 1px 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.txt { max-height: 38vh; overflow-y: auto; white-space: pre-wrap; min-width: 60px; }
.txt.wait { display: flex; gap: 6px; padding: 6px 4px; }
.txt.wait i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); opacity: .3; animation: think 1s infinite; }
.txt.wait i:nth-child(2) { animation-delay: .15s; } .txt.wait i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 50% { opacity: 1; transform: translateY(-4px); } }
.next { position: absolute; right: 12px; bottom: 6px; width: 0; height: 0; border-left: 10px solid var(--ink); border-top: 7px solid transparent; border-bottom: 7px solid transparent; animation: nudge .7s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.tail { position: absolute; bottom: -13px; width: 22px; height: 22px; margin-left: -11px; background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }

#tapHint { position: absolute; left: 50%; bottom: 28px; z-index: 5; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); display: grid; place-items: center; animation: bounce 1s ease-in-out infinite; pointer-events: none; }
#tapHint::after { content: ""; border-left: 16px solid var(--ink); border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
@keyframes bounce { 50% { transform: translateY(-6px); } }

#dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 20px; }
.dock-in { display: flex; gap: 8px; width: min(640px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 6px; box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
#idea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 500 17px var(--ui); padding: 10px 12px; outline: none; }
#idea::placeholder { color: #8a7766; }
.gavel-btn { flex: none; width: 52px; height: 48px; border-radius: 16px; border: 3px solid var(--ink); background: var(--judge); cursor: pointer; display: grid; place-items: center; }
.gavel-btn:active { transform: translateY(2px); }
.gavel-btn:focus-visible, #quit:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
#quit { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); cursor: pointer; display: grid; place-items: center; }

@media (prefers-reduced-motion: reduce) {
  .bubble.pop, .next, #tapHint, .txt.wait i { animation: none; }
}
</style>

<div id="game"></div>
<div class="bubble" id="bubble" hidden><span class="who" id="who"></span><div class="txt" id="txt"></div><span class="next" id="next" hidden></span><span class="tail" id="tail"></span></div>
<div id="tapHint" hidden></div>
<form id="dock">
  <div class="dock-in">
    <input id="idea" maxlength="300" autocomplete="off" placeholder="What idea goes on trial?" aria-label="Idea to put on trial">
    <button class="gavel-btn" type="submit" aria-label="Start the trial">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><g fill="#2a1c12"><rect x="5" y="3" width="9" height="6" rx="1.5" transform="rotate(-45 9.5 6)"/><rect x="11" y="9" width="3" height="12" rx="1.5" transform="rotate(-45 12.5 15)"/><rect x="3" y="19" width="11" height="2.5" rx="1.2"/></g></svg>
    </button>
  </div>
</form>
<button id="quit" type="button" aria-label="Adjourn the trial" hidden>
  <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="#2a1c12" stroke-width="3" stroke-linecap="round"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Cast ---------- */
const JURORS = [
  { name: "Dolores", age: 71, job: "retired high school chemistry teacher in Ohio", voice: "You taught chemistry for 38 years. You grade arguments like lab reports: claims need evidence, and you dock points for exaggeration. Dry, stern, fair." },
  { name: "Marcus", age: 34, job: "union electrician in Philadelphia", voice: "Practical and blunt. You think about who has to do the work and what it costs regular people. You distrust ideas that sound good in a meeting but fall apart on the job." },
  { name: "Priya", age: 27, job: "UX designer in Austin", voice: "Optimistic about change. You think about how real people would experience it day to day and like concrete examples over abstractions." },
  { name: "Hank", age: 58, job: "cattle rancher in Montana", voice: "You value self-reliance and local control and you've seen grand plans from far away go sideways. Few words, plain talk, but common sense can convince you." },
  { name: "Jasmine", age: 19, job: "college sophomore in Atlanta", voice: "Idealistic, quick, online. You care about fairness and the future and get annoyed by arguments that boil down to tradition. You talk casually." },
  { name: "Samuel", age: 63, job: "Baptist pastor in Memphis", voice: "You weigh what an idea does to families, neighbors, and people who get left behind. Warm and patient, firm when people get treated like numbers." },
  { name: "Kenji", age: 45, job: "insurance actuary in Hartford", voice: "You think in probabilities, base rates, and worst cases, and you notice when an anecdote is passed off as a trend. Calm and precise." },
  { name: "Tasha", age: 39, job: "ER nurse in Chicago", voice: "You've cleaned up after plenty of bad decisions. You look for unintended harm and safety risks first. Direct, a little tired, no patience for fluff." },
  { name: "Luis", age: 50, job: "taco truck owner in Phoenix", voice: "You run a small business on thin margins. Cost, red tape, and whether this helps the little guy. Friendly and funny but you know a bad deal." },
  { name: "Margaret", age: 82, job: "former city council member in Vermont", voice: "Sixteen years on a city council. You care about process, precedent, and how things actually get implemented. Sharp and a little wry." },
  { name: "Devin", age: 31, job: "startup founder in San Francisco", voice: "You like big swings and think most institutions are too cautious. Contrarian, unimpressed by arguments that list risks without weighing upside." },
  { name: "Ruth", age: 44, job: "single mom and school bus driver in Kansas City", voice: "You raise two kids alone. Time, money, and whether this makes regular families' lives easier or harder. Grounded, honest, no patience for being talked down to." }
];

/* ---------- Three.js scene ---------- */
const T = THREE;
const CORAL = 0xd97757, INK = 0x1b1410, WHITE = 0xf7f4ee;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const host = document.getElementById("game");
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x1a130e);
scene.fog = new T.Fog(0x1a130e, 22, 40);
const camera = new T.PerspectiveCamera(45, 1, 0.1, 100);

scene.add(new T.HemisphereLight(0xfff1dc, 0x3a2516, 0.75));
const sun = new T.DirectionalLight(0xffe6c4, 0.85);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 });
scene.add(sun);
const lamp = new T.PointLight(0xffc98a, 0.5, 16);
lamp.position.set(0, 5, -4);
scene.add(lamp);

const mats = {};
const mat = (c) => mats[c] || (mats[c] = new T.MeshLambertMaterial({ color: c }));
function box(parent, w, h, d, color, x = 0, y = 0, z = 0, shadow = true) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), typeof color === "number" ? mat(color) : color);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new T.CanvasTexture(c); t.anisotropy = 4;
  return t;
}

/* Room */
const room = new T.Group(); scene.add(room);
box(room, 28, 0.2, 22, 0x8a5a36, 0, -0.1, 0).castShadow = false;
for (let x = -13; x <= 13; x += 1.3) box(room, 0.04, 0.01, 22, 0x6e4529, x, 0.005, 0, false);
box(room, 28, 2.6, 0.3, 0x5b3a26, 0, 1.3, -9);
box(room, 28, 7, 0.3, 0xe7d8bd, 0, 6.1, -9.05, false);
box(room, 28, 0.2, 0.4, 0x3f281a, 0, 2.6, -8.9);
[-13.5, 13.5].forEach((x) => { box(room, 0.3, 2.6, 22, 0x5b3a26, x, 1.3, 0); box(room, 0.3, 7, 22, 0xe7d8bd, x * 1.003, 6.1, 0, false); });
// seal
const seal = new T.Mesh(new T.CylinderGeometry(1.25, 1.25, 0.12, 40), mat(0xc8952e));
seal.rotation.x = Math.PI / 2; seal.position.set(0, 5.9, -8.85); room.add(seal);
const sealIn = new T.Mesh(new T.CylinderGeometry(0.95, 0.95, 0.14, 40), mat(0x23324d));
sealIn.rotation.x = Math.PI / 2; sealIn.position.set(0, 5.9, -8.82); room.add(sealIn);
box(room, 0.08, 0.9, 0.06, 0xc8952e, 0, 5.85, -8.72, false);
box(room, 1.1, 0.07, 0.06, 0xc8952e, 0, 6.25, -8.72, false);
[-0.45, 0.45].forEach((x) => box(room, 0.32, 0.06, 0.06, 0xc8952e, x, 5.75, -8.72, false));
// flags
const flagTex = canvasTex(192, 120, (g, w, h) => {
  for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? "#f4f1ea" : "#b22234"; g.fillRect(0, (i * h) / 13, w, h / 13 + 1); }
  g.fillStyle = "#3c3b6e"; g.fillRect(0, 0, w * 0.42, (h * 7) / 13);
  g.fillStyle = "#f4f1ea";
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { g.beginPath(); g.arc(8 + c * 13, 7 + r * 12, 2.4, 0, 7); g.fill(); }
});
[-4.6, 4.6].forEach((x) => {
  box(room, 0.08, 5.2, 0.08, 0xc8952e, x, 2.6, -8.3);
  const f = new T.Mesh(new T.PlaneGeometry(1.6, 1.0), new T.MeshLambertMaterial({ map: flagTex, side: T.DoubleSide }));
  f.position.set(x + (x < 0 ? 0.84 : -0.84), 4.55, -8.3); room.add(f);
});
// judge platform and bench
box(room, 7.4, 1.1, 2.8, 0x4a2f1f, 0, 0.55, -7.3);
box(room, 6.6, 1.75, 0.9, 0x6b4328, 0, 0.875, -5.75);
box(room, 7.0, 0.12, 1.2, 0x3f281a, 0, 1.8, -5.8);
for (let x = -2.6; x <= 2.6; x += 1.3) box(room, 1.0, 1.1, 0.04, 0x5b3a26, x, 0.9, -5.28, false);
box(room, 0.5, 0.1, 0.4, 0x3f281a, 1.1, 1.91, -5.8); // sound block
// counsel tables
const TABLES = { for: new T.Vector3(-3.2, 0, 1.0), against: new T.Vector3(3.0, 0, 1.0) };
function counselTable(p, cloth) {
  const g = new T.Group(); g.position.copy(p); room.add(g);
  box(g, 2.8, 0.12, 1.2, 0x6b4328, 0, 0.9, 0);
  [[-1.25, -0.5], [1.25, -0.5], [-1.25, 0.5], [1.25, 0.5]].forEach(([x, z]) => box(g, 0.1, 0.9, 0.1, 0x4a2f1f, x, 0.45, z));
  box(g, 2.8, 0.55, 0.05, cloth, 0, 0.6, -0.6);
  [0x2b4a7a, 0x7a2b2b, 0x3d6b3a, 0xc8952e].forEach((c, i) => box(g, 0.5, 0.1, 0.36, c, -0.8, 1.01 + i * 0.1, 0.05 * (i % 2)));
  box(g, 0.6, 0.38, 0.16, 0x3a2516, 0.9, 1.15, 0);
  return g;
}
counselTable(TABLES.for, 0x2f9e7e);
counselTable(TABLES.against, 0xd1495b);
// bar rail and gallery
box(room, 7.5, 0.9, 0.12, 0x5b3a26, -5.2, 0.45, 3.4); box(room, 7.5, 0.9, 0.12, 0x5b3a26, 5.2, 0.45, 3.4);
[4.8, 6.3, 7.8].forEach((z) => { box(room, 7, 0.45, 0.7, 0x6b4328, -5, 0.45, z); box(room, 7, 0.45, 0.7, 0x6b4328, 5, 0.45, z); box(room, 7, 0.7, 0.12, 0x5b3a26, -5, 0.9, z + 0.35); box(room, 7, 0.7, 0.12, 0x5b3a26, 5, 0.9, z + 0.35); });
// jury box
box(room, 1.4, 0.3, 8.2, 0x4a2f1f, 7.1, 0.15, -1.3);
box(room, 1.4, 0.7, 8.2, 0x3f281a, 8.5, 0.35, -1.3);
box(room, 0.15, 0.95, 8.4, 0x6b4328, 6.3, 0.475, -1.3);
box(room, 0.3, 0.08, 8.5, 0x3f281a, 6.3, 0.99, -1.3);
box(room, 3, 0.95, 0.15, 0x6b4328, 7.8, 0.475, 2.85);

/* Critters */
function critter(scale = 1) {
  const root = new T.Group(); root.scale.setScalar(scale);
  const hop = new T.Group(); root.add(hop);
  const body = new T.Group(); hop.add(body);
  const legs = [-0.36, -0.12, 0.12, 0.36].map((x) => { const l = box(hop, 0.13, 0.42, 0.16, CORAL, x, 0.21, 0); l.userData.y = 0.21; return l; });
  box(body, 1.0, 0.72, 0.62, CORAL, 0, 0.78, 0);
  const armL = new T.Group(); armL.position.set(-0.5, 0.84, 0); body.add(armL); box(armL, 0.24, 0.26, 0.3, CORAL, -0.12, 0, 0);
  const armR = new T.Group(); armR.position.set(0.5, 0.84, 0); body.add(armR); box(armR, 0.24, 0.26, 0.3, CORAL, 0.12, 0, 0);
  const eyes = new T.Group(); eyes.position.set(0, 0.84, 0.315); body.add(eyes);
  box(eyes, 0.09, 0.22, 0.02, INK, -0.2, 0, 0, false); box(eyes, 0.09, 0.22, 0.02, INK, 0.2, 0, 0, false);
  const dots = new T.Group(); root.add(dots); dots.visible = false;
  [[0.38, 1.32, 0.06], [0.55, 1.52, 0.085], [0.78, 1.8, 0.12]].forEach(([x, y, r]) => { const m = new T.Mesh(new T.SphereGeometry(r, 14, 10), mat(0xffffff)); m.position.set(x, y, 0); dots.add(m); });
  return { root, hop, body, armL, armR, eyes, legs, dots, top: 1.2 * scale, mode: "idle", phase: Math.random() * 6, face: null, walk: null, t0: 0, sign: null, signOn: false, ballot: null };
}

const PROPS = [
  (b) => { box(b, 0.36, 0.2, 0.3, 0xc8c6c2, 0, 1.24, -0.05); box(b, 0.66, 0.05, 0.03, INK, 0, 0.97, 0.33, false); [-0.33, -0.07, 0.07, 0.33].forEach((x) => box(b, 0.035, 0.27, 0.03, INK, x, 0.84, 0.33, false)); box(b, 0.66, 0.035, 0.03, INK, 0, 0.71, 0.33, false); },
  (b) => { box(b, 0.84, 0.2, 0.64, 0xf2c230, 0, 1.24, 0); box(b, 1.1, 0.05, 0.84, 0xf2c230, 0, 1.16, 0.04); box(b, 0.1, 0.22, 0.66, 0xd9a514, 0, 1.26, 0); },
  (b) => { box(b, 0.9, 0.08, 0.14, 0x7a6ae0, 0, 1.2, 0); [-1, 1].forEach((s) => { box(b, 0.08, 0.22, 0.14, 0x7a6ae0, s * 0.48, 1.1, 0); box(b, 0.12, 0.28, 0.28, 0x5a4bc0, s * 0.55, 0.96, 0); }); },
  (b) => { box(b, 0.56, 0.3, 0.5, 0x8a5a2b, 0, 1.33, 0); box(b, 0.57, 0.06, 0.51, 0x5e3b19, 0, 1.22, 0); box(b, 1.4, 0.05, 1.0, 0x8a5a2b, 0, 1.17, 0); },
  (b) => { box(b, 0.86, 0.24, 0.66, 0xe86aa6, 0, 1.24, 0); box(b, 0.88, 0.08, 0.68, 0xc94f8a, 0, 1.14, 0); box(b, 0.17, 0.17, 0.17, WHITE, 0, 1.44, 0); },
  (b) => { box(b, 1.02, 0.08, 0.64, INK, 0, 0.6, 0); box(b, 0.13, 0.08, 0.02, WHITE, 0, 0.6, 0.325, false); },
  (b) => { box(b, 0.15, 0.1, 0.03, 0x2b3f74, 0, 0.62, 0.33, false); box(b, 0.1, 0.24, 0.03, 0x2b3f74, 0, 0.47, 0.33, false); },
  (b) => { box(b, 0.5, 0.2, 0.36, WHITE, 0, 1.24, 0.05); box(b, 0.06, 0.14, 0.02, 0xd23c3c, 0, 1.24, 0.235, false); box(b, 0.15, 0.05, 0.02, 0xd23c3c, 0, 1.24, 0.235, false); },
  (b) => { box(b, 1.02, 0.15, 0.64, 0xd23c3c, 0, 1.06, 0); box(b, 0.1, 0.14, 0.2, 0xd23c3c, -0.45, 1.02, -0.38); box(b, 0.36, 0.06, 0.03, 0x4a2c17, 0, 0.66, 0.33, false); },
  (b) => { box(b, 0.34, 0.2, 0.3, 0xdedbd5, 0, 1.24, -0.05); box(b, 0.18, 0.12, 0.18, 0xdedbd5, 0, 1.39, -0.05); for (let x = -0.3; x <= 0.31; x += 0.1) box(b, 0.06, 0.06, 0.04, WHITE, x, 0.56, 0.33, false); },
  (b) => { box(b, 0.64, 0.17, 0.03, INK, 0, 0.86, 0.335, false); box(b, 0.04, 0.04, 0.3, INK, -0.32, 0.9, 0.18, false); box(b, 0.04, 0.04, 0.3, INK, 0.32, 0.9, 0.18, false); },
  (b) => { box(b, 0.8, 0.18, 0.62, 0x3c64b4, 0, 1.23, 0); box(b, 0.6, 0.04, 0.3, 0x2c4d92, 0, 1.15, 0.42); box(b, 0.1, 0.08, 0.02, 0xf2c230, 0, 1.24, 0.315, false); }
];

// Judge
const judge = critter(1.3);
box(judge.body, 1.06, 0.42, 0.68, 0x14110f, 0, 0.6, 0);
box(judge.body, 0.4, 0.12, 0.02, WHITE, 0, 0.78, 0.33, false);
const gavel = new T.Group(); gavel.position.set(0.14, 0, 0.12); judge.armR.add(gavel);
box(gavel, 0.05, 0.05, 0.42, 0x6b4423, 0, 0, 0.2);
box(gavel, 0.28, 0.14, 0.14, 0x4a2e17, 0, 0, 0.42);
judge.root.position.set(0, 1.1, -6.7);
judge.face = new T.Vector3(0, 0, 5);
judge.rest = 0.5;
scene.add(judge.root);

// Lawyers
function lawyer(suit, tie) {
  const c = critter(1);
  box(c.body, 1.04, 0.36, 0.66, suit, 0, 0.6, 0);
  box(c.body, 0.14, 0.1, 0.03, tie, 0, 0.7, 0.34, false);
  box(c.body, 0.1, 0.22, 0.03, tie, 0, 0.56, 0.34, false);
  scene.add(c.root);
  return c;
}
const counsel = { for: lawyer(0x24324a, 0x2f9e7e), against: lawyer(0x2f2f33, 0xd1495b) };
const SPOT = { for: new T.Vector3(-3.2, 0, 2.3), against: new T.Vector3(3.0, 0, 2.3) };
const PODIUM = new T.Vector3(0.6, 0, -0.6);
const JUDGE_SPOT = new T.Vector3(0, 0, -6.7);

// Papers for research
const papers = [];
["for", "against"].forEach((side) => {
  for (let i = 0; i < 7; i++) {
    const m = new T.Mesh(new T.PlaneGeometry(0.24, 0.32), new T.MeshLambertMaterial({ color: 0xffffff, side: T.DoubleSide, transparent: true }));
    m.visible = false; scene.add(m);
    papers.push({ m, side, ph: Math.random() });
  }
});
let researching = false;

// Jurors
const juryRoot = new T.Group(); scene.add(juryRoot);
const jurors = JURORS.map((j, i) => {
  const c = critter(0.82);
  PROPS[i](c.body);

/* ---------- Animation ---------- */
const clock = new T.Clock();
let now = 0;
const ease = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function lerpAngle(a, b, k) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * k; }

function walkTo(c, to, dur = 1.6) {
  c.walk = { from: c.root.position.clone(), to: to.clone(), t0: now, dur: reduced ? 0.01 : dur };
  return wait(reduced ? 50 : dur * 1000);
}
function setMode(c, m) { c.mode = m; c.t0 = now; }

function updateCritter(c, dt) {
  const t = now, k = 1 - Math.exp(-dt * 9);
  let walking = false;
  if (c.walk) {
    const p = Math.min(1, (t - c.walk.t0) / c.walk.dur);
    c.root.position.lerpVectors(c.walk.from, c.walk.to, ease(p));
    walking = p < 1;
    if (!walking) c.walk = null;
  }
  const target = walking ? c.walk.to : c.face;
  if (target) {
    const dx = target.x - c.root.position.x, dz = target.z - c.root.position.z;
    if (dx * dx + dz * dz > 0.01) c.root.rotation.y = lerpAngle(c.root.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-dt * 6));
  }
  c.legs.forEach((l, i) => { l.position.y = l.userData.y + (walking ? Math.max(0, Math.sin(t * 14 + (i % 2) * Math.PI)) * 0.12 : 0); });

  let hopY = Math.sin(t * 2.2 + c.phase) * 0.025, rx = 0, rz = 0, ry = 0, aL = 0.15, aR = 0.15, armX = 0;
  const since = t - c.t0;
  switch (c.mode) {
    case "talk": aR = 0.9 + Math.sin(t * 5) * 0.7; aL = 0.4 + Math.sin(t * 3.3 + 1) * 0.35; hopY += Math.abs(Math.sin(t * 6)) * 0.04; rz = Math.sin(t * 2.5) * 0.05; break;
    case "think": rz = Math.sin(t * 2.4 + c.phase) * 0.08; aR = 1.5 + Math.sin(t * 4) * 0.15; break;
    case "research": rx = 0.3 + Math.sin(t * 3 + c.phase) * 0.06; aL = 0.7 + Math.sin(t * 8) * 0.3; aR = 0.7 + Math.sin(t * 8 + 2) * 0.3; break;
    case "sealed": aL = aR = 0.25; armX = -0.9; if (since < 0.45) hopY += Math.sin((since / 0.45) * Math.PI) * 0.3; break;
    case "yay": aL = aR = 2.7; if (since < 1.3) hopY += Math.abs(Math.sin(since * 7.2)) * 0.45; break;
    case "nay": aL = aR = 2.7; if (since < 1.2) ry = Math.sin(since * 22) * 0.3 * (1 - since / 1.2); break;
    case "cheer": aL = aR = 2.8; hopY += Math.abs(Math.sin(t * 8)) * 0.45; break;
    case "sad": rx = 0.4; aL = aR = -0.05; hopY -= 0.05; break;
    case "shrug": aL = aR = 1.2 + Math.sin(t * 3) * 0.25; break;
    case "lookup": rx = -0.12; break;
  }

  c.body.rotation.x = lerp(c.body.rotation.x, rx, k);
  c.body.rotation.z = lerp(c.body.rotation.z, rz, k);
  c.body.rotation.y = c.mode === "nay" ? ry : lerp(c.body.rotation.y, 0, k);
  c.armL.rotation.z = lerp(c.armL.rotation.z, -aL, k);
  c.armL.rotation.x = lerp(c.armL.rotation.x, armX, k);
  if (c.gavel) {
    const g = c.gavel, p = (t - g.t0) / 0.42;

    else { const f = p % 1; c.armR.rotation.x = f < 0.55 ? lerp(-0.2, -1.5, f / 0.55) : lerp(-1.5, 0.35, (f - 0.55) / 0.45); c.armR.rotation.z = 0.35; }

  if (!c.gavel) {

  if (c.dots.visible) c.dots.children.forEach((d, i) => { d.position.y = [1.32, 1.52, 1.8][i] + Math.sin(t * 4 + i) * 0.04; });
  if (c.sign) {
    const s = lerp(c.sign.scale.x, c.signOn ? 1 : 0.001, 1 - Math.exp(-dt * 12));
    c.sign.scale.setScalar(s);

}

/* Camera */
const camTarget = new T.Vector3(0, 1.2, -2);
const cam = { fromP: new T.Vector3(), fromT: new T.Vector3(), toP: new T.Vector3(), toT: new T.Vector3(), t0: -10, dur: 1, shot: "orbit" };
function shot(name) {
  const S = {
    judge: [[0, 3.5, -1.0], [0, 2.75, -6.6]],
    tables: [[0, 4.6, 7.5], [0, 1.0, 1.2]],
    podium: [[1.2, 2.3, 3.1], [0.8, 1.3, -0.6]],
    jury: [[-0.8, 4.3, -0.9], [7.8, 1.5, -1.2]],
    wide: [[0, 7.2, 12.5], [0, 1.2, -2]]
  }[name];
  const p = new T.Vector3(...S[0]), t = new T.Vector3(...S[1]);
  const a = camera.aspect, f = a < 1.3 ? Math.min(2.2, 1.3 / a) : 1;
  if (f > 1) p.sub(t).multiplyScalar(f).add(t);
  return { p, t };
}
function camTo(name, dur = 1.5) {
  cam.shot = name;
  if (name === "orbit") return;
  const s = shot(name);
  cam.fromP.copy(camera.position); cam.fromT.copy(camTarget);
  cam.toP.copy(s.p); cam.toT.copy(s.t);
  cam.t0 = now; cam.dur = reduced ? 0.001 : dur;
}
function updateCamera() {
  if (cam.shot === "orbit") {
    const a = Math.sin(now * 0.1) * 0.55, f = camera.aspect < 1.3 ? Math.min(2.2, 1.3 / camera.aspect) : 1;
    const want = new T.Vector3(Math.sin(a) * 12 * f, 6.5 + (f - 1) * 2, -1 + Math.cos(a) * 12 * f);
    camera.position.lerp(want, 0.03);
    camTarget.lerp(new T.Vector3(0, 1.4, -2.5), 0.03);
  } else {
    const p = Math.min(1, (now - cam.t0) / cam.dur), e = ease(p);
    camera.position.lerpVectors(cam.fromP, cam.toP, e);
    camTarget.lerpVectors(cam.fromT, cam.toT, e);
    if (!reduced) { camera.position.x += Math.sin(now * 0.4) * 0.05; camera.position.y += Math.sin(now * 0.33) * 0.03; }
  }
  camera.lookAt(camTarget);
}
camera.position.set(0, 7, 13);

function resize() {

/* ---------- Speech bubble ---------- */
const bubbleEl = document.getElementById("bubble"), txtEl = document.getElementById("txt"), whoEl = document.getElementById("who");
const nextEl = document.getElementById("next"), tailEl = document.getElementById("tail"), tapHint = document.getElementById("tapHint");
const bubble = { open: false, who: null, line: null, shown: 0, lastLen: -1 };
const WAIT_DOTS = "<i></i><i></i><i></i>";

function openBubble(c, label, color, line) {
  bubble.open = true; bubble.who = c; bubble.line = line; bubble.shown = 0; bubble.lastLen = -1;
  whoEl.textContent = label;
  bubbleEl.style.setProperty("--who", color);
  txtEl.className = "txt wait"; txtEl.innerHTML = WAIT_DOTS;
  bubbleEl.hidden = false;
  bubbleEl.classList.remove("pop"); void bubbleEl.offsetWidth; bubbleEl.classList.add("pop");
}
function closeBubble() { bubble.open = false; bubbleEl.hidden = true; nextEl.hidden = true; }
const bubbleComplete = () => bubble.open && bubble.line.done && bubble.shown >= bubble.line.text.length;

const tmpV = new T.Vector3();
function updateBubble(dt) {
  if (!bubble.open) return;
  const line = bubble.line, target = line.text;
  if (target.length) {
    bubble.shown = Math.min(target.length, bubble.shown + dt * (line.done ? 70 : 45));
    const n = Math.floor(bubble.shown);
    if (n !== bubble.lastLen) {
      if (txtEl.classList.contains("wait")) { txtEl.className = "txt"; }
      txtEl.textContent = target.slice(0, n);
      txtEl.scrollTop = txtEl.scrollHeight;
      bubble.lastLen = n;
    }
  }
  nextEl.hidden = !(bubbleComplete() && advanceCb);
  // anchor above the speaker's head
  const c = bubble.who;
  tmpV.set(0, c.top / c.root.scale.y + 0.45, 0);
  c.root.localToWorld(tmpV);
  tmpV.project(camera);
  const W = innerWidth, H = innerHeight;
  const x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * H;
  const bw = bubbleEl.offsetWidth, bh = bubbleEl.offsetHeight;
  const left = Math.max(12, Math.min(W - bw - 12, x - bw / 2));
  let top = y - bh - 22;
  const hiddenTail = top < 60 || tmpV.z > 1;
  top = Math.max(60, Math.min(H - bh - 100, top));
  bubbleEl.style.transform = `translate(${left}px, ${top}px)`;
  tailEl.hidden = hiddenTail;
  tailEl.style.left = Math.max(26, Math.min(bw - 26, x - left)) + "px";
}

/* Advance on tap / space */
let advanceCb = null;
function waitAdvance() { return new Promise((r) => { advanceCb = r; }); }
function onTap() {
  if (bubble.open && !bubbleComplete()) { if (bubble.line.done) bubble.shown = bubble.line.text.length; return; }
  if (advanceCb) { const cb = advanceCb; advanceCb = null; cb(); }
}
host.addEventListener("pointerdown", onTap);
bubbleEl.addEventListener("pointerdown", onTap);
addEventListener("keydown", (e) => {
  if (document.activeElement && document.activeElement.id === "idea") return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); onTap(); }

/* ---------- Sound ---------- */
let audio = null;

  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

}
function bangGavel(hits = 3) {

  for (let i = 0; i < hits; i++) setTimeout(thunk, (i * 0.42 + 0.32) * 1000);
  return wait(hits * 420 + 150);
}

/* ---------- Loop ---------- */
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  now += dt;
  updateCamera();
  [judge, counsel.for, counsel.against, ...jurors].forEach((c) => updateCritter(c, dt));
  papers.forEach((p) => {
    p.m.visible = researching;
    if (!researching) return;
    const life = (now * 0.55 + p.ph) % 1, base = TABLES[p.side];
    p.m.position.set(base.x - 0.8 + Math.sin(p.ph * 20) * 0.7 * life, 1.15 + life * 2.2, base.z + Math.cos(p.ph * 13) * 0.5 * life);
    p.m.rotation.set(now * 2 + p.ph * 9, now * 1.3 + p.ph * 5, 0);

/* ---------- Claude ---------- */
let sample = null;
if (window.claude && typeof window.claude.use === "function") window.claude.use("sample").then((s) => { sample = s; });

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const sideName = (side) => side === "for" ? "FOR" : "AGAINST";
const STAGES = [
  { side: "for", title: "Opening for the idea", ask: "your opening statement. Say why this idea should go forward." },
  { side: "against", title: "Opening against the idea", ask: "your opening statement. Say why this idea should not go forward, and answer what opposing counsel just said." },
  { side: "for", title: "Closing for the idea", ask: "your closing argument. Hit back at the other side's specific points and make your final case." },
  { side: "against", title: "Closing against the idea", ask: "your closing argument. You speak last. Hit back at the other side's specific points and make your final case." }
];
const FATAL = new Set(["not_granted", "sampling_disabled", "session_expired", "not_declared", "capability_disabled", "cancelled"]);

function researchPrompt(side, idea) {
  return `You are counsel ${sideName(side)} this idea in a mock trial in the United States. The year is 2026.

Idea on trial: """${idea}"""

Research period. You can't browse the web, so work from what you actually know: real studies, data, precedents, places that tried something similar, expert consensus, economics, practical reasoning. Do not invent statistics, studies, quotes or sources. If you're unsure of a number, say "roughly" or leave it out.

Reply with only JSON: {"theory":"one sentence, the core of your case","points":["4 to 6 strong points, each 1-2 sentences, strongest first"]}`;
}
function cleanResearch(r) {
  if (!r || typeof r.theory !== "string" || !Array.isArray(r.points) || !r.points.length) throw { code: "invalid_json" };
  return { theory: r.theory, points: r.points.slice(0, 6).map(String) };
}
const fileText = (r) => `Theory: ${r.theory}\n- ${r.points.join("\n- ")}`;
function recordText(P, upTo) {
  const s = STAGES.slice(0, upTo).map((st, i) => `${st.title}:\n${P.speeches[i].text}`);
  return s.length ? s.join("\n\n") : "(nothing yet, you speak first)";
}
function argPrompt(P, st, i) {
  return `Mock trial, United States, 2026. You are counsel ${sideName(st.side)} this idea: """${P.idea}"""

Your research:
${fileText(P.research[st.side])}

What's been said so far:
${recordText(P, i)}

Now give ${st.ask}

This is spoken out loud in a speech bubble in a courtroom video game, so keep it punchy: 60 to 90 words, plain spoken English, like a sharp lawyer talking to a jury. Don't bring in facts beyond your research. No headings, lists, stage directions, or quotation marks around the whole thing. Start talking right away.`;
}
const fullRecord = (P) => `RESEARCH FOR:\n${fileText(P.research.for)}\n\nRESEARCH AGAINST:\n${fileText(P.research.against)}\n\nTRANSCRIPT:\n${recordText(P, 4)}`;
function jurorPrompt(P, j, i) {
  return `You are Juror No. ${i + 1} in a mock trial in the United States.

Who you are: ${j.name}, ${j.age}, ${j.job}. ${j.voice}

The idea on trial: """${P.idea}"""

Everything presented in court:
${fullRecord(P)}

Secret ballot. You haven't talked to the other jurors and can't see their votes. Decide for yourself, as the person described, based on what was argued. YAY means the idea should go forward, NAY means it shouldn't. Your personality shapes what you care about, but follow the arguments.

Reply with only JSON: {"vote":"YAY" or "NAY","reason":"one or two sentences in your own voice"}`;
}
function judgePrompt(P) {
  const R = P.ruling;
  const lines = P.votes.map((v, i) => v ? `${JURORS[i].name} (${JURORS[i].job}): ${v.vote}. "${v.reason}"` : `${JURORS[i].name}: excused`).join("\n");
  return `You are the judge in a mock trial in the United States, speaking out loud from the bench in a courtroom video game.

The idea on trial: """${P.idea}"""

Record:
${fullRecord(P)}

Secret ballot: ${R.y} YAY, ${R.n} NAY.
${lines}

Result: ${R.text} You must announce this result and can't overturn it.${R.kind === "hung" ? " Since the jury split evenly, also give your own non-binding view of who argued better." : ""}

Deliver the verdict out loud in 3 or 4 sentences, at most 85 words: announce the result with the vote count, say which argument carried it, and give the person who filed the idea one piece of practical advice. Plain spoken with a little courtroom flavor. No headings or lists. Start speaking right away.`;
}

const mkLine = (text) => ({ text: text || "", done: !!text, error: null });
async function pool(items, limit, fn) {
  let next = 0;
  await Promise.all(Array.from({ length: limit }, async () => { while (next < items.length) { const i = next++; await fn(items[i], i); } }));
}

function startPipeline(idea, signal) {
  const P = { idea, research: {}, speeches: STAGES.map(() => mkLine()), votes: Array(12).fill(null), voted: Array(12).fill(false), verdict: mkLine(), fatal: null };
  const fail = (e) => { if (!P.fatal) P.fatal = e || { code: "upstream_error" }; throw P.fatal; };
  const runLine = (line, prompt) => sample(prompt, { signal, cache: false, onText: ({ text }) => { line.text = text; } })
    .then((r) => { line.text = r.text.trim(); line.done = true; });
  P.researchP = Promise.all(["for", "against"].map((side) =>
    sample.json(researchPrompt(side, idea), { signal, cache: false }).then((r) => { P.research[side] = cleanResearch(r); })
  )).catch(fail);
  let chain = P.researchP;
  STAGES.forEach((st, i) => { chain = chain.then(() => runLine(P.speeches[i], argPrompt(P, st, i)).catch(fail)); });
  P.votesP = chain.then(() => pool(JURORS, 3, async (j, i) => {
    try {
      const v = await sample.json(jurorPrompt(P, j, i), { signal, cache: false });
      const vote = String((v && v.vote) || "").toUpperCase();
      if (vote === "YAY" || vote === "NAY") P.votes[i] = { vote, reason: String(v.reason || "") };
    } catch (e) {
      if (e && FATAL.has(e.code)) fail(e);
    }
    P.voted[i] = true;
    if (phase === "jury") setMode(jurors[i], P.votes[i] ? "sealed" : "idle");
  })).then(() => {
    const y = P.votes.filter((v) => v && v.vote === "YAY").length, n = P.votes.filter((v) => v && v.vote === "NAY").length;
    if (!y && !n) fail({ code: "upstream_error" });
    P.ruling = y > n ? { kind: "yay", y, n, text: `The jury voted ${y} to ${n} in favor. The idea is upheld.` }
      : n > y ? { kind: "nay", y, n, text: `The jury voted ${n} to ${y} against. The idea is rejected.` }
      : { kind: "hung", y, n, text: `The jury split ${y} to ${n}. It's a hung jury.` };
  });
  P.verdictP = P.votesP.then(() => runLine(P.verdict, judgePrompt(P)).catch(fail));
  [P.researchP, P.votesP, P.verdictP].forEach((p) => p.catch(() => {}));
  return P;
}

function resetCourt() {

async function say(c, label, color, line, P) {

    await wait(120);
  }

}

async function trial(idea) {
  const my = ++trialId;
  const chk = () => { if (my !== trialId) throw { code: "cancelled" }; };
  ctl = new AbortController();
  dock.hidden = true; quitBtn.hidden = false; ideaBox.blur();
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (!signTex) makeSignTex();
  resetCourt();
  let P = null;
  try {
    phase = "intro";
    camTo("judge", 1.8);
    if (!sample) {
      await wait(1200);
      await say(judge, "The Judge", "var(--judge)", mkLine("I can only hold court inside Claude. Open this page there and file your case again."));
      return;
    }
    P = startPipeline(idea, ctl.signal);
    await wait(1300); chk();
    await bangGavel(3); chk();
    await say(judge, "The Judge", "var(--judge)", mkLine(`Order in the court! Today's case: "${idea}" Counsel, you may begin your research.`), P); chk();

    phase = "research";
    camTo("tables", 1.6);
    researching = true;
    setMode(counsel.for, "research"); setMode(counsel.against, "research");
    await P.researchP.catch(() => {}); chk();
    if (P.fatal) throw P.fatal;
    researching = false;
    setMode(counsel.for, "idle"); setMode(counsel.against, "idle");
    await wait(500); chk();

    phase = "args";
    for (let i = 0; i < STAGES.length; i++) {
      const side = STAGES[i].side, c = counsel[side];
      camTo("tables", 1.0);
      jurors.forEach((j) => { j.face = c.root.position; });
      await walkTo(c, PODIUM, 1.7); chk();
      c.face = new T.Vector3(3, 0, 5);
      camTo("podium", 1.2);
      await wait(700); chk();
      await say(c, side === "for" ? "Counsel for" : "Counsel against", side === "for" ? "var(--for)" : "var(--against)", P.speeches[i], P); chk();
      c.face = null;
      await walkTo(c, SPOT[side], 1.5); chk();
      c.face = JUDGE_SPOT;
    }

    phase = "jury";
    jurors.forEach((j) => { j.face = JURY_LOOK; });
    camTo("judge", 1.3);
    await say(judge, "The Judge", "var(--judge)", mkLine("Jurors, you've heard both sides. Cast your secret ballots."), P); chk();
    camTo("jury", 1.6);
    jurors.forEach((j, i) => setMode(j, P.voted[i] ? (P.votes[i] ? "sealed" : "idle") : "think"));
    await P.votesP.catch(() => {}); chk();
    if (P.fatal) throw P.fatal;
    await wait(900); chk();
    for (let i = 0; i < 12; i++) {
      const v = P.votes[i], j = jurors[i];
      if (v) { j.signFace.map = signTex[v.vote]; j.signFace.needsUpdate = true; j.signOn = true; setMode(j, v.vote.toLowerCase()); }
      await wait(reduced ? 80 : 380); chk();
    }
    await waitAdvance(); chk();

    phase = "verdict";
    jurors.forEach((j) => { j.signOn = false; setMode(j, "lookup"); j.face = JUDGE_SPOT; });
    camTo("judge", 1.6);
    await wait(1200); chk();
    await bangGavel(2); chk();
    await say(judge, "The Judge", "var(--judge)", P.verdict, P); chk();
    await bangGavel(1); chk();

    camTo("wide", 2);
    const k = P.ruling.kind;
    setMode(counsel.for, k === "yay" ? "cheer" : k === "nay" ? "sad" : "shrug");
    setMode(counsel.against, k === "nay" ? "cheer" : k === "yay" ? "sad" : "shrug");
    counsel.for.face = counsel.against.face = new T.Vector3(0, 0, 12);
    jurors.forEach((j, i) => { const v = P.votes[i]; setMode(j, !v ? "idle" : (k === "hung" ? "idle" : (v.vote.toLowerCase() === k ? "cheer" : "idle"))); j.face = JURY_LOOK; });
    await wait(3200); chk();
  } catch (e) {
    if (my !== trialId || (e && e.code === "cancelled")) return;
    researching = false;
    camTo("judge", 1);
    await say(judge, "The Judge", "var(--judge)", mkLine(errCopy(e))).catch(() => {});
  } finally {
    if (my === trialId) { if (ctl) ctl.abort(); showHome(); }
  }
}

document.getElementById("dock").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const idea = ideaBox.value.trim();
  if (idea.length < 4) { ideaBox.focus(); return; }
  trial(idea);
});
quitBtn.addEventListener("click", () => {
  trialId++;
  if (ctl) ctl.abort();
  if (advanceCb) { const cb = advanceCb; advanceCb = null; cb(); }
  resetCourt();
  showHome();
});
showHome();
</script>
