const empty = (msg, btn = true) => `<div class="panel empty"><p>${msg}</p>${btn ? '<button class="btn" data-goedit>Open the editor</button>' : ''}</div>`;
function bindEmpty(p) { const b = $('[data-goedit]', p); if (b) b.onclick = () => go({ ...view, tab: 'edit' }); }

/* flashcards */
function paneCards(p, set) {
  if (!set.cards.length) { p.innerHTML = empty('This set has no flashcards yet.'); return bindEmpty(p); }
  const st = view.fc ||= { order: set.cards.map((_, i) => i), pos: 0, flipped: false, only: false, starOnly: false, defFirst: false, before: readiness(set) };
  const visible = () => st.order.filter(i => (!st.only || !set.cards[i].known) && (!st.starOnly || set.cards[i].star));
  const draw = () => {
    const order = visible();
    const known = set.cards.filter(c => c.known).length;
    if (st.starOnly && !order.length && !st.roundDone) {
      p.innerHTML = `<div class="panel empty"><h2>No starred cards${st.only ? ' left to learn' : ''}</h2><p>Tap the star on a card to add it to this pile.</p><button class="btn" id="allc">Show all cards</button></div>`;
      $('#allc', p).onclick = () => { st.starOnly = false; st.only = false; st.pos = 0; draw(); };
      return;
    }
    if (!order.length || st.roundDone) {
      p.innerHTML = `<div class="panel empty"><h2>${order.length ? 'Round done' : `You marked all ${set.cards.length} terms as known`}</h2>
        <p>${known} known · ${set.cards.length - known} still learning</p>
        <div class="row" style="justify-content:center">
          ${known < set.cards.length ? '<button class="btn" id="onlyL">Study the still-learning cards</button>' : '<button class="btn" id="reset">Reset known cards</button>'}
          <button class="btn primary" id="again">Go again</button>
        </div></div>${readinessPanel(set, st.before)}`;
      const restart = only => { Object.assign(st, { roundDone: false, pos: 0, flipped: false, only, before: readiness(set) }); draw(); };
      if ($('#onlyL', p)) $('#onlyL', p).onclick = () => restart(true);
      if ($('#reset', p)) $('#reset', p).onclick = () => { set.cards.forEach(c => c.known = false); saveSets(set); restart(false); };
      $('#again', p).onclick = () => restart(st.only && known < set.cards.length);
      return;
    }
    st.pos = Math.min(st.pos, order.length - 1);
    const c = set.cards[order[st.pos]];
    const [f, b] = st.defFirst ? [c.definition, c.term] : [c.term, c.definition];
    p.innerHTML = `
      <div class="row spread small"><strong>${st.pos + 1} / ${order.length}</strong><span class="muted">${known} known · ${set.cards.length - known} still learning</span></div>
      <div class="bar"><div style="width:${(st.pos + 1) / order.length * 100}%"></div></div>
      <div class="tools">
        ${canSpeak ? '<button class="btn ghost sm" id="speak">Read aloud</button>' : ''}
        <button class="btn ghost sm star ${c.star ? 'on' : ''}" id="star" aria-pressed="${!!c.star}">${c.star ? '★ Starred' : '☆ Star'}</button>
      </div>
      <button class="flash ${st.flipped ? 'flipped' : ''}" id="flash" aria-label="Flip card">
        <span class="swipe-tag k">Know it</span><span class="swipe-tag l">Still learning</span>
        <div class="inner">
          <div class="face front"><span class="lbl">${st.defFirst ? 'Definition' : 'Term'}</span>${esc(f)}</div>
          <div class="face back"><span class="lbl">${st.defFirst ? 'Term' : 'Definition'}</span>${esc(b)}</div>
        </div>
      </button>
      <div class="fc-ctrl">
        <button class="btn" id="prev" aria-label="Previous">←</button>
        <button class="btn bad" id="learn">Still learning</button>
        <button class="btn good" id="know">Know it</button>
        <button class="btn" id="next" aria-label="Next">→</button>
      </div>
      <div class="row">
        <button class="btn ghost sm" id="shuf">Shuffle</button>
        <label class="check"><input type="checkbox" id="only" ${st.only ? 'checked' : ''}> Only still-learning</label>
        <label class="check"><input type="checkbox" id="staro" ${st.starOnly ? 'checked' : ''}> Only starred</label>
        <label class="check"><input type="checkbox" id="deff" ${st.defFirst ? 'checked' : ''}> Definition first</label>
      </div>
      <p class="muted small" style="margin-top:10px">Tap the card or press space to flip. Swipe right if you know it, left if you're still learning. Arrow keys move between cards.</p>`;
    const flash = $('#flash', p);
    const flip = () => { st.flipped = !st.flipped; flash.classList.toggle('flipped', st.flipped); };
    const move = d => { st.pos = (st.pos + d + order.length) % order.length; st.flipped = false; draw(); };
    const mark = k => {
      c.known = k; bump(c, k, ALPHA.card); saveSets(set); st.flipped = false;
      if (!(st.only && k)) st.pos++;
      if (st.pos >= visible().length) { st.pos = 0; st.roundDone = true; }
      draw();
    };
    // swipe: drag the card sideways past 80px to rate it
    let sx = null, sy = 0, dx = 0, dragged = false;
    flash.onpointerdown = e => { sx = e.clientX; sy = e.clientY; dx = 0; dragged = false; };
    flash.onpointermove = e => {
      if (sx == null) return;
      dx = e.clientX - sx;
      if (!dragged && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.clientY - sy)) { dragged = true; flash.classList.add('dragging'); try { flash.setPointerCapture(e.pointerId); } catch {} }
      if (dragged) { flash.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; flash.dataset.dir = dx > 40 ? 'right' : dx < -40 ? 'left' : ''; }
    };
    const end = () => {
      if (sx == null) return; sx = null;
      if (!dragged) return;
      flash.classList.remove('dragging');
      if (Math.abs(dx) > 80) { flash.style.transform = `translateX(${dx > 0 ? 600 : -600}px) rotate(${dx > 0 ? 20 : -20}deg)`; setTimeout(() => mark(dx > 0), 160); }
      else { flash.style.transform = ''; flash.dataset.dir = ''; }
    };
    flash.onpointerup = end; flash.onpointercancel = end;
    flash.onclick = () => { if (dragged) { dragged = false; return; } flip(); };
    if ($('#speak', p)) $('#speak', p).onclick = () => speak(st.flipped ? b : f);
    $('#star', p).onclick = () => { c.star = !c.star; if (!c.star) delete c.star; saveSets(set); draw(); };
    $('#prev', p).onclick = () => move(-1);
    $('#next', p).onclick = () => move(1);
    $('#know', p).onclick = () => mark(true);
    $('#learn', p).onclick = () => mark(false);
    $('#shuf', p).onclick = () => { st.order = shuffle(st.order); st.pos = 0; st.flipped = false; draw(); toast('Shuffled'); };
    $('#only', p).onchange = e => { st.only = e.target.checked; st.pos = 0; st.flipped = false; draw(); };
    $('#staro', p).onchange = e => { st.starOnly = e.target.checked; st.pos = 0; st.flipped = false; draw(); };
    $('#deff', p).onchange = e => { st.defFirst = e.target.checked; st.flipped = false; draw(); };
    keyHandler = e => {
      if (e.key === ' ') { e.preventDefault(); flip(); }
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowLeft') move(-1);
    };
  };
  draw();
}

/* learn: rounds of up to 7 terms; a term is learned after one right multiple-choice
   answer and then one right written answer. Misses come back next round. */
function paneLearn(p, set) {
  if (!set.cards.length) { p.innerHTML = empty('This set has no flashcards yet.'); return bindEmpty(p); }
  let st = view.learn;
  if (!st) {
    const starred = set.cards.filter(c => c.star), plan = todayPlan(set);
    const o = view.learnOpt ||= { which: view.plan && plan?.cards.length ? 'plan' : 'all', showDef: true };
    p.innerHTML = `
      <div class="panel">
        <h2>Learn</h2>
        <p class="muted">Short rounds that adapt to you. You start with multiple choice, then type the answer once you've got it. Terms you miss come back until you know them.</p>
        <div style="display:grid;gap:8px;margin-bottom:14px">
          <label class="check"><input type="radio" name="lw" value="all" ${o.which === 'all' ? 'checked' : ''}> All terms (${set.cards.length})</label>
          <label class="check"><input type="radio" name="lw" value="weak" ${o.which === 'weak' ? 'checked' : ''}> Only terms I'm weak on (${set.cards.filter(c => eff(c) < 0.7).length})</label>
          <label class="check"><input type="radio" name="lw" value="star" ${o.which === 'star' ? 'checked' : ''} ${starred.length ? '' : 'disabled'}> Starred terms (${starred.length})</label>
          ${plan?.cards.length ? `<label class="check"><input type="radio" name="lw" value="plan" ${o.which === 'plan' ? 'checked' : ''}> Today's plan (${plan.cards.length})</label>` : ''}
        </div>
        <label class="field" style="max-width:320px">Questions show
          <select id="lDir"><option value="def" ${o.showDef ? 'selected' : ''}>the definition, you answer with the term</option><option value="term" ${o.showDef ? '' : 'selected'}>the term, you answer with the definition</option></select></label>
        <button class="btn primary" id="lStart">Start learning</button>
        <div class="status err" id="lErr"></div>
      </div>${readinessPanel(set)}`;
    $('#lStart', p).onclick = () => {
      o.which = $('input[name=lw]:checked', p)?.value || 'all'; o.showDef = $('#lDir', p).value === 'def';
      const pool = o.which === 'star' ? starred : o.which === 'plan' ? plan.cards : o.which === 'weak' ? set.cards.filter(c => eff(c) < 0.7) : set.cards;
      if (!pool.length) { $('#lErr', p).textContent = 'No terms in that group right now.'; return; }
      view.learn = { pool: pool.slice(), stage: new Map(), roundNo: 0, round: [], ri: 0, phase: 'ask', showDef: o.showDef, before: readiness(set), log: [] };
      nextRound(view.learn); paneLearn(p, set);
    };
    return;
  }

  const stageOf = c => st.stage.get(c) || 0;
  const counts = () => { let m = 0, l = 0; st.pool.forEach(c => { const g = stageOf(c); if (g >= 2) m++; else if (g === 1) l++; }); return { m, l, n: st.pool.length - m - l }; };
  const k = counts();
  const bar = `<div class="segbar"><div class="m" style="width:${k.m / st.pool.length * 100}%"></div><div class="l" style="width:${k.l / st.pool.length * 100}%"></div></div>
    <div class="row spread small muted"><span>Learned ${k.m} · In progress ${k.l} · Not started ${k.n}</span><button class="btn ghost sm" id="lQuit">End session</button></div>`;

  if (st.phase === 'done') {
    p.innerHTML = `<div class="panel empty"><h2>You learned all ${st.pool.length} terms</h2><p>Come back in a day or two and run it again so they stick.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="lAgain">Learn again</button><button class="btn primary" id="lTest">Take a practice test</button></div></div>${readinessPanel(set, st.before)}`;
    $('#lAgain', p).onclick = () => { view.learn = null; paneLearn(p, set); };
    $('#lTest', p).onclick = () => go({ name: 'set', id: set.id, tab: 'test' });
    return;
  }
  if (st.phase === 'roundEnd') {
    const r = st.log.filter(x => x.round === st.roundNo), right = r.filter(x => x.ok).length;
    p.innerHTML = `${bar}<div class="panel empty"><h2>Round ${st.roundNo} done</h2><p>${right} of ${r.length} right this round.</p>
      <button class="btn primary" id="lNext">Keep going</button></div>`;
    $('#lNext', p).onclick = () => { nextRound(st); paneLearn(p, set); };
    keyHandler = e => { if (e.key === 'Enter') $('#lNext', p).click(); };
    bindQuit();
    return;
  }

  const c = st.round[st.ri];
  const prompt = st.showDef ? c.definition : c.term, expected = st.showDef ? c.term : c.definition;
  const field = st.showDef ? 'term' : 'definition';
  const written = stageOf(c) >= 1 || set.cards.length < 4;
  if (!st.q || st.q.card !== c) {
    st.q = { card: c, written, answer: null, ok: null, why: '', checking: false };
    if (!written) {
      const others = shuffle(set.cards.filter(x => x !== c && x[field] !== expected)).slice(0, 3);
      st.q.choices = shuffle([c, ...others]);
    }
  }
  const q = st.q;
  let body = '';
  if (!q.written) body = `<div class="opts">${q.choices.map((x, i) => {
    let cls = '';
    if (q.ok !== null) cls = x === c ? 'ok' : q.answer === i ? 'no' : '';
    return `<button class="opt ${cls}" data-lo="${i}" ${q.ok !== null ? 'disabled' : ''}><kbd>${i + 1}</kbd>${esc(x[field])}</button>`; }).join('')}</div>`;
  else body = `<div class="row" style="flex-wrap:nowrap"><input type="text" id="lIn" autocomplete="off" placeholder="Type the ${field}" value="${esc(q.answer || '')}" ${q.ok !== null || q.checking ? 'disabled' : ''}>
      ${q.ok === null ? `<button class="btn primary" id="lCheck" ${q.checking ? 'disabled' : ''}>${q.checking ? '<span class="spin"></span>' : 'Check'}</button>` : ''}</div>
      ${q.ok === null && !q.checking ? '<button class="btn ghost sm" id="lSkip" style="margin-top:8px">I don\'t know</button>' : ''}`;
  let fb = '';
  if (q.ok === true) fb = `<div class="fb good">${q.why ? 'Claude counted this as correct. ' + esc(q.why) : 'Correct!'}${q.written && q.why ? ` <span class="muted">Expected: ${esc(expected)}</span>` : ''}</div>`;
  else if (q.ok === false) fb = `<div class="fb bad">The answer is <strong>${esc(expected)}</strong>.${q.why ? ' ' + esc(q.why) : ''}</div>
    <div class="row" style="margin-top:8px">${sample ? '<button class="btn sm" id="lEx">Explain this</button>' : ''}${q.written && q.answer ? '<button class="btn sm" id="lOv">I was right</button>' : ''}</div><div class="exbox" id="lExBox" hidden></div>`;
  p.innerHTML = `${bar}
    <div class="lq">
      <div class="row spread"><span class="eyebrow">${q.written ? 'Type the answer' : 'Pick the answer'} · ${st.showDef ? 'Definition' : 'Term'}</span>
        <span class="row" style="gap:4px">${canSpeak ? '<button class="btn ghost sm" id="lSpeak">Read aloud</button>' : ''}<button class="btn ghost sm star ${c.star ? 'on' : ''}" id="lStar">${c.star ? '★' : '☆'}</button></span></div>
      <div class="prompt">${esc(prompt)}</div>
      ${body}${fb}
      ${q.ok !== null ? '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="lCont">Continue</button></div>' : ''}
    </div>`;

  const finish = (ok, why = '') => {
    q.ok = ok; q.why = why;
    if (ok) st.stage.set(c, stageOf(c) + 1);
    bump(c, ok, ALPHA.learn); saveSets(set);
    st.log.push({ round: st.roundNo, card: c, ok });
    paneLearn(p, set);
  };
  const advance = () => {
    st.q = null; st.ri++;
    if (st.ri >= st.round.length) st.phase = st.pool.every(x => stageOf(x) >= 2) ? 'done' : 'roundEnd';
    paneLearn(p, set);
  };
  $$('[data-lo]', p).forEach(b => b.onclick = () => { q.answer = +b.dataset.lo; finish(q.choices[q.answer] === c); });
  const inp = $('#lIn', p);
  const check = async () => {
    const a = inp.value.trim(); if (!a) return;
    q.answer = a;
    if (looseMatch(a, expected)) return finish(true);
    if (!sample) return finish(false);
    q.checking = true; paneLearn(p, set);
    let res = null;
    try { res = (await aiGrade(set, [{ q: { question: prompt, answer: expected }, i: 0, a }]))[0]; } catch {}
    q.checking = false;
    if (view.learn !== st || st.q !== q) return;
    finish(!!res?.ok, res?.why || '');
  };
  if (inp && q.ok === null && !q.checking) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') check(); }; }
  if ($('#lCheck', p)) $('#lCheck', p).onclick = check;
  if ($('#lSkip', p)) $('#lSkip', p).onclick = () => { q.answer = ''; finish(false); };
  if ($('#lCont', p)) { $('#lCont', p).onclick = advance; if (!q.written || q.ok !== null) $('#lCont', p).focus(); }
  if ($('#lOv', p)) $('#lOv', p).onclick = () => {
    st.log.pop(); st.stage.set(c, stageOf(c) + 1); bump(c, true, ALPHA.learn); bump(c, true, 0.2); saveSets(set);
    st.log.push({ round: st.roundNo, card: c, ok: true }); q.ok = true; q.why = ''; paneLearn(p, set);
  };
  if ($('#lEx', p)) $('#lEx', p).onclick = e => { e.target.disabled = true; explain($('#lExBox', p), set, { question: prompt, correct: expected, given: q.written ? (q.answer || "(didn't know)") : q.choices[q.answer][field], about: c.term }); };
  if ($('#lSpeak', p)) $('#lSpeak', p).onclick = () => speak(prompt);
  $('#lStar', p).onclick = () => { c.star = !c.star; if (!c.star) delete c.star; saveSets(set); paneLearn(p, set); };
  keyHandler = e => {
    if (q.ok === null && !q.written && /^[1-4]$/.test(e.key) && q.choices[+e.key - 1]) $(`[data-lo="${+e.key - 1}"]`, p).click();
    else if (q.ok !== null && e.key === 'Enter') advance();
  };
  bindQuit();
  function bindQuit() { $('#lQuit', p).onclick = () => { view.learn = null; paneLearn(p, set); }; }
}
function nextRound(st) {
  const left = st.pool.filter(c => (st.stage.get(c) || 0) < 2)
    .sort((a, b) => (st.stage.get(b) || 0) - (st.stage.get(a) || 0) || eff(a) - eff(b));
  st.round = shuffle(left.slice(0, 7)); st.ri = 0; st.roundNo++; st.phase = 'ask'; st.q = null;
}

/* practice test */
function paneTest(p, set) {
  const n = set.cards.length, nAI = set.questions.length;
  if (!n && !nAI) { p.innerHTML = empty('Add some terms or generate questions with AI to make a test.'); return bindEmpty(p); }
  const st = view.test;
  if (!st) {
    const o = view.testOpt ||= { count: Math.min(20, nAI + n), ai: nAI > 0, mc: n >= 4, tf: n >= 2, written: n > 0, star: false };
    const nStar = set.cards.filter(c => c.star).length;
    p.innerHTML = `
      <div class="panel">
        <h2>Set up your test</h2>
        <label class="field" style="max-width:200px">Number of questions <input type="number" id="cnt" min="1" value="${o.count}"></label>
        <div style="display:grid;gap:8px;margin-bottom:16px">
          <label class="check"><input type="checkbox" id="tAI" ${o.ai ? 'checked' : ''} ${nAI ? '' : 'disabled'}> AI-written questions (${nAI})</label>
          <label class="check"><input type="checkbox" id="tMC" ${o.mc ? 'checked' : ''} ${n >= 4 ? '' : 'disabled'}> Multiple choice from flashcards ${n >= 4 ? '' : '(needs 4+ terms)'}</label>
          <label class="check"><input type="checkbox" id="tTF" ${o.tf ? 'checked' : ''} ${n >= 2 ? '' : 'disabled'}> True / false from flashcards ${n >= 2 ? '' : '(needs 2+ terms)'}</label>
          <label class="check"><input type="checkbox" id="tW" ${o.written ? 'checked' : ''} ${n ? '' : 'disabled'}> Written: see the definition, type the term</label>
          <label class="check" style="margin-top:6px"><input type="checkbox" id="tStar" ${o.star && nStar ? 'checked' : ''} ${nStar ? '' : 'disabled'}> Only starred terms (${nStar})</label>
        </div>
        <button class="btn primary" id="start">Start test</button>
        <div class="status err" id="tErr"></div>
      </div>`;
    $('#start', p).onclick = () => {
      Object.assign(o, { count: Math.max(1, parseInt($('#cnt', p).value) || 10), ai: $('#tAI', p).checked, mc: $('#tMC', p).checked, tf: $('#tTF', p).checked, written: $('#tW', p).checked, star: $('#tStar', p).checked });
      const qs = buildTest(set, o);
      if (!qs.length) { $('#tErr', p).textContent = 'Pick at least one question type.'; return; }
      view.test = newTestState(qs); paneTest(p, set); window.scrollTo(0, 0);
    };
    return;
  }
  if (st.grading) {
    p.innerHTML = '<div class="panel empty"><p><span class="spin"></span> Claude is checking your written answers...</p></div>';
    return;
  }

  const grade = (q, i) => isRight(st, q, i);
  const right = st.done ? st.qs.filter(grade).length : 0;
  const missed = st.qs.length - right;
  p.innerHTML = `
    ${st.weak && !st.done ? '<div class="panel"><div class="eyebrow">Weak-spot test</div>Claude wrote these questions around what you missed last time and your weakest terms.</div>' : ''}
    ${st.done ? `<div class="panel row spread"><div><div class="eyebrow">${st.weak ? 'Weak-spot test' : 'Practice test'}</div><div class="score">${Math.round(right / st.qs.length * 100)}%</div><div class="muted">${right} of ${st.qs.length} correct</div></div>
      <div class="row"><button class="btn" id="retake">Retake</button><button class="btn" id="newTest">New test</button>
      ${sample ? `<button class="btn primary" id="weakTest">${missed ? 'Make a test on what I missed' : 'Make a harder test'}</button>` : ''}</div>
      <div class="status err" id="weakErr" style="flex-basis:100%"></div></div>
      ${readinessPanel(set, st.before)}` : ''}
    ${st.qs.map((q, i) => {
      const ok = st.done && grade(q, i), a = st.answers[i];
      let body = '';
      if (q.type === 'mc') body = `<div class="opts">${q.choices.map((c, k) => {
        let cls = a === k ? 'sel' : '';
        if (st.done) cls = k === q.answer ? 'ok' : a === k ? 'no' : '';
        return `<button class="opt ${cls}" data-q="${i}" data-v="${k}" ${st.done ? 'disabled' : ''}>${esc(c)}</button>`; }).join('')}</div>`;
      else if (q.type === 'tf') body = `<div class="opts tf">${[true, false].map(v => {
        let cls = a === v ? 'sel' : '';
        if (st.done) cls = v === q.answer ? 'ok' : a === v ? 'no' : '';
        return `<button class="opt ${cls}" data-q="${i}" data-v="${v}" ${st.done ? 'disabled' : ''}>${v ? 'True' : 'False'}</button>`; }).join('')}</div>`;
      else body = `<input type="text" data-w="${i}" value="${esc(a || '')}" placeholder="${q.src === 'card' ? 'Type the term' : 'Type your answer'}" ${st.done ? 'disabled' : ''} autocomplete="off">`;
      let fb = '';
      if (st.done) {
        const exp = q.explanation ? ' ' + esc(q.explanation) : '';
        const ai = st.ai[i];
        if (ok && q.type === 'written' && ai?.ok && !st.override[i]) fb = `<div class="fb good">Claude counted this as correct. ${esc(ai.why)} <span class="muted">Expected: ${esc(q.answer)}</span></div>`;
        else if (ok) fb = `<div class="fb good">Correct.${exp}</div>`;
        else if (q.type === 'written') fb = `<div class="fb bad">Answer: <strong>${esc(q.answer)}</strong>.${ai?.why ? ' ' + esc(ai.why) : exp} <button class="btn sm" data-ov="${i}">I was right</button></div>`;
        else fb = `<div class="fb bad">${a == null ? 'Not answered.' : 'Incorrect.'}${exp}</div>`;
        if (!ok && sample) fb += `<button class="btn sm" data-ex="${i}" style="margin-top:8px">Explain this</button><div class="exbox" id="ex${i}" hidden></div>`;
      }
      const label = { mc: 'Multiple choice', tf: 'True or false', written: 'Written' }[q.type];
      return `<div class="q ${st.done ? (ok ? 'right' : 'wrong') : ''}"><div class="qn">${i + 1} of ${st.qs.length} · ${label}</div><div class="qt">${esc(q.question)}</div>${body}${fb}</div>`;
    }).join('')}
    ${st.done ? '' : '<div class="row" style="justify-content:flex-end"><button class="btn primary" id="submit">Check answers</button></div>'}`;

  $$('[data-q]', p).forEach(b => b.onclick = () => {
    const i = +b.dataset.q, q = st.qs[i];
    st.answers[i] = q.type === 'tf' ? b.dataset.v === 'true' : +b.dataset.v;
    $$(`[data-q="${i}"]`, p).forEach(x => x.classList.toggle('sel', x === b));
  });
  $$('[data-w]', p).forEach(inp => inp.oninput = () => st.answers[+inp.dataset.w] = inp.value);
  $$('[data-ex]', p).forEach(b => b.onclick = () => {
    const i = +b.dataset.ex, q = st.qs[i]; b.disabled = true;
    explain($('#ex' + i, p), set, { question: q.question, correct: answerText(q), given: givenText(q, st.answers[i]), about: q.about });
  });
  $$('[data-ov]', p).forEach(b => b.onclick = () => { st.override[+b.dataset.ov] = true; applyTest(set, st); paneTest(p, set); });
  if ($('#submit', p)) $('#submit', p).onclick = async () => {
    const missing = st.qs.length - st.qs.filter((q, i) => st.answers[i] != null && st.answers[i] !== '').length;
    if (missing && !await ask(`${missing} question${missing > 1 ? 's are' : ' is'} unanswered. Check anyway?`, 'Check answers')) return;
    st.done = true; st.before = readiness(set);
    const toCheck = st.qs.map((q, i) => ({ q, i, a: st.answers[i] }))
      .filter(x => x.q.type === 'written' && x.a && x.a.trim() && !looseMatch(x.a, x.q.answer));
    if (sample && toCheck.length) {
      st.grading = true; paneTest(p, set);
      try { st.ai = await aiGrade(set, toCheck); }
      catch (e) { toast(e?.code === 'rate_limited' ? 'Claude usage limit reached, so written answers used typo matching only.' : 'Could not reach Claude to check written answers. Typo matching was used.'); }
      st.grading = false;
    }
    applyTest(set, st);
    if (view.test === st) { paneTest(p, set); window.scrollTo(0, 0); }
  };
  if ($('#retake', p)) $('#retake', p).onclick = () => { view.test = newTestState(st.qs, st.weak); paneTest(p, set); window.scrollTo(0, 0); };
  if ($('#newTest', p)) $('#newTest', p).onclick = () => { view.test = null; paneTest(p, set); };
  if ($('#weakTest', p)) $('#weakTest', p).onclick = async () => {
    const b = $('#weakTest', p); b.disabled = true; b.innerHTML = '<span class="spin"></span> Claude is writing your test...';
    try {
      const qs = await weakTest(set, st);
      if (!qs.length) throw new Error('Claude did not return any usable questions. Try again.');
      view.test = newTestState(qs, true); paneTest(p, set); window.scrollTo(0, 0);
    } catch (e) {
      b.disabled = false; b.textContent = 'Try again'; $('#weakErr', p).textContent = aiError(e);
    }
  };
}

function newTestState(qs, weak = false) { return { qs, answers: [], done: false, override: {}, ai: {}, weak }; }
function isRight(st, q, i) {
  const a = st.answers[i];
  if (st.override[i]) return true;
  if (q.type === 'written') return !!a && (looseMatch(a, q.answer) || !!st.ai[i]?.ok);
  return a === q.answer;
}
function cardFor(set, q) {
  const key = (q.about || '').toLowerCase();
  if (key) { const c = set.cards.find(c => c.term.toLowerCase() === key); if (c) return c; }
  const text = (q.question + ' ' + (q.type === 'written' ? q.answer : '')).toLowerCase();
  return set.cards.find(c => c.term.length >= 3 && text.includes(c.term.toLowerCase())) || null;
}
// Re-runnable: an "I was right" override restores the snapshot and applies the results again.
function applyTest(set, st) {
  if (st.snap) st.snap.forEach(([c, s, t]) => { if (s === undefined) delete c.s; else c.s = s; if (t === undefined) delete c.t; else c.t = t; });
  else st.snap = set.cards.map(c => [c, c.s, c.t]);
  const right = st.qs.filter((q, i) => isRight(st, q, i)).length;
  st.qs.forEach((q, i) => { const c = cardFor(set, q); if (c) bump(c, isRight(st, q, i), ALPHA.test); });
  set.tests ||= [];
  const score = right / st.qs.length, prev = st.recAt && set.tests.find(t => t.at === st.recAt);
  if (prev) prev.score = score;
  else { st.recAt = Date.now(); set.tests.push({ at: st.recAt, score }); set.tests = set.tests.slice(-20); }
  saveSets(set);
}
const answerText = q => q.type === 'mc' ? q.choices[q.answer] : q.type === 'tf' ? (q.answer ? 'True' : 'False') : q.answer;
function givenText(q, a) {
  if (a == null || a === '') return '(left blank)';
  return q.type === 'mc' ? q.choices[a] : q.type === 'tf' ? (a ? 'True' : 'False') : a;
}

async function aiGrade(set, items) {
  const list = items.map(x => ({ id: x.i, question: x.q.question, expected: x.q.answer, student: x.a.trim() }));
  const res = await sample.json(`You are grading short written answers on a practice test about "${set.title}".
For each item, decide whether the student's answer is correct. Count it as correct if it means the same thing as the expected answer: a synonym, a longer or shorter phrasing of the same idea (for example "polar molecules" for "polar"), singular vs plural, or a small spelling mistake. Count it as wrong if it names a different concept, is too vague to show they know it, or contradicts the expected answer.

Reply with only a JSON array, one object per item, in the same order:
[{"id": 0, "correct": true, "why": "one short sentence written to the student"}]

Items:
${JSON.stringify(list, null, 1)}`, { modelTier: 'quick', cache: false });
  const out = {};
  if (Array.isArray(res)) res.forEach(r => { if (r && Number.isInteger(Number(r.id))) out[Number(r.id)] = { ok: r.correct === true || r.correct === 'true', why: String(r.why || '').slice(0, 300) }; });
  return out;
}

async function weakTest(set, st) {
  const missed = st.qs.map((q, i) => ({ q, i })).filter(({ q, i }) => !isRight(st, q, i))
    .map(({ q, i }) => ({ question: q.question, correct: answerText(q), student: givenText(q, st.answers[i]) }));
  const weak = set.cards.slice().sort((a, b) => eff(a) - eff(b)).slice(0, 8).map(c => c.term);
  const n = Math.min(Math.max(st.qs.length, 8), 25);
  const cards = set.cards.map(c => `- ${c.term}: ${c.definition}`).join('\n').slice(0, 100000);
  const cats = set.categories.map(c => `- ${c.name}: ${c.items.join('; ')}`).join('\n');
  const res = await sample.json(`You write a follow-up practice test for a student, aimed at their weak spots. Use only facts from the study set below. Write in plain, simple language.

STUDY SET (term: definition):
${cards}
${cats ? `\nCATEGORIES:\n${cats}\n` : ''}
QUESTIONS THEY GOT WRONG ON THEIR LAST TEST:
${missed.length ? JSON.stringify(missed, null, 1) : '(none, they got everything right, so make this test harder)'}

THEIR WEAKEST TERMS: ${weak.join(', ')}

Write ${n} new questions.
- About 70% target the missed questions and weakest terms. Ask about the same ideas from new angles (applying it, comparing it to a similar term, cause and effect). Do not reuse the old wording.
- The rest check other terms so they keep them fresh.
- Mix: about 50% "mc", 20% "tf", 30% "written". A written answer is a few words at most.
- For "mc", "answer" is the 0-based index of the correct choice. Put it in a random position and make wrong choices believable.
- "about" is the study set term the question tests, copied exactly.

Reply with only JSON in this shape:
{"questions": [
  {"type": "mc", "question": "...", "choices": ["...", "...", "...", "..."], "answer": 0, "explanation": "one sentence", "about": "term"},
  {"type": "tf", "question": "a true or false statement", "answer": true, "explanation": "one sentence", "about": "term"},
  {"type": "written", "question": "...", "answer": "short expected answer", "explanation": "one sentence", "about": "term"}
]}`, { cache: false });
  return shuffle((Array.isArray(res?.questions) ? res.questions : []).map(normQuestion).filter(Boolean));
}

function buildTest(set, o) {
  const cards = o.star ? set.cards.filter(c => c.star) : set.cards, out = [];
  if (o.ai) out.push(...set.questions.filter(q => !o.star || cardFor(set, q)?.star).map(q => ({ ...q })));
  const types = [];
  if (o.mc && cards.length >= 4) types.push('mc');
  if (o.tf && cards.length >= 2) types.push('tf');
  if (o.written && cards.length) types.push('written');
  if (types.length) cards.forEach((c, i) => {
    const others = cards.filter((_, j) => j !== i);
    const t = pick(types);
    if (t === 'mc') {
      const ch = shuffle([{ t: c.definition, ok: true }, ...shuffle(others).slice(0, 3).map(x => ({ t: x.definition }))]);
      out.push({ type: 'mc', src: 'card', about: c.term, question: `What does "${c.term}" mean?`, choices: ch.map(x => x.t), answer: ch.findIndex(x => x.ok) });
    } else if (t === 'tf') {
      const truth = Math.random() < 0.5;
      out.push({ type: 'tf', src: 'card', about: c.term, question: `${c.term}: ${truth ? c.definition : pick(others).definition}`, answer: truth, explanation: truth ? '' : `${c.term} actually means: ${c.definition}` });
    } else out.push({ type: 'written', src: 'card', about: c.term, question: c.definition, answer: c.term });
  });
  return shuffle(out).slice(0, o.count);
}

function norm(s) { return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\b(the|a|an)\b/g, '').replace(/\s+/g, ' ').trim(); }
function dist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function looseMatch(a, b) {
  a = norm(a); b = norm(b);
  if (!a) return false;
  return a === b || dist(a, b) <= Math.floor(b.length * 0.15);
}

/* match game */
function paneMatch(p, set) {
  if (set.cards.length < 2) { p.innerHTML = empty('Match needs at least 2 flashcards.'); return bindEmpty(p); }
  const st = view.match;
  if (!st) {
    p.innerHTML = `<div class="panel empty">
      <h2>Match</h2><p>Pair each term with its definition as fast as you can. Wrong pairs add 1 second.</p>
      ${set.bestMatch ? `<p class="muted">Best time: <strong>${set.bestMatch.toFixed(1)}s</strong></p>` : ''}
      <button class="btn primary" id="go">Start game</button></div>`;
    $('#go', p).onclick = () => {
      const picked = shuffle(set.cards).slice(0, 6);
      view.match = { picked, missed: new Set(), before: readiness(set), tiles: shuffle(picked.flatMap((c, k) => [{ k, t: c.term }, { k, t: c.definition }])), sel: null, gone: new Set(), start: Date.now(), pen: 0, time: null };
      paneMatch(p, set);
    };
    return;
  }
  if (st.time != null) {
    const best = set.bestMatch === st.time;
    p.innerHTML = `<div class="panel empty"><h2>${st.time.toFixed(1)} seconds</h2>
      <p>${best ? 'New best time!' : `Best time: ${set.bestMatch.toFixed(1)}s`}</p>
      <button class="btn primary" id="again">Play again</button></div>${readinessPanel(set, st.before)}`;
    $('#again', p).onclick = () => { view.match = null; paneMatch(p, set); $('#go', p).click(); };
    return;
  }
  p.innerHTML = `<div class="row spread" style="margin-bottom:12px"><span class="timer" id="timer">0.0s</span><button class="btn sm" id="quit">Quit</button></div>
    <div class="tiles">${st.tiles.map((t, i) => `<button class="tile ${st.gone.has(i) ? 'gone' : ''}" data-t="${i}">${esc(t.t)}</button>`).join('')}</div>`;
  const tick = () => { const el = $('#timer'); if (el) el.textContent = ((Date.now() - st.start) / 1000 + st.pen).toFixed(1) + 's'; };
  timerId = setInterval(tick, 100);
  $('#quit', p).onclick = () => { clearInterval(timerId); view.match = null; paneMatch(p, set); };
  $$('[data-t]', p).forEach(b => b.onclick = () => {
    const i = +b.dataset.t;
    if (st.gone.has(i)) return;
    $$('.tile.miss', p).forEach(x => x.classList.remove('miss'));
    if (st.sel === null) { st.sel = i; b.classList.add('sel'); return; }
    if (st.sel === i) { st.sel = null; b.classList.remove('sel'); return; }
    const a = $(`[data-t="${st.sel}"]`, p);
    a.classList.remove('sel');
    if (st.tiles[st.sel].k === st.tiles[i].k) {
      st.gone.add(st.sel).add(i); a.classList.add('gone'); b.classList.add('gone');
      if (st.gone.size === st.tiles.length) {
        clearInterval(timerId);
        st.time = (Date.now() - st.start) / 1000 + st.pen;
        if (!set.bestMatch || st.time < set.bestMatch) set.bestMatch = st.time;
        st.picked.forEach((c, k) => bump(c, !st.missed.has(k), ALPHA.match));
        saveSets(set);
        setTimeout(() => paneMatch(p, set), 300);
      }
    } else {
      st.pen += 1; a.classList.add('miss'); b.classList.add('miss');
      st.missed.add(st.tiles[st.sel].k).add(st.tiles[i].k);
    }
    st.sel = null;
  });
}

/* category sort */
function paneCats(p, set) {
  if (!set.categories.length) { p.innerHTML = empty('This set has no categories. Generate the set with AI, or add them in the editor.'); return bindEmpty(p); }
  const st = view.cat ||= { items: shuffle(set.categories.flatMap((c, ci) => c.items.map(t => ({ t, c: ci })))), at: {}, sel: null, checked: false };
  const draw = () => {
    const chip = i => {
      const it = st.items[i], placed = st.at[i] != null;
      const cls = st.checked && placed ? (st.at[i] === it.c ? 'ok' : 'no') : st.sel === i ? 'sel' : '';
      return `<button class="chip ${cls}" data-i="${i}" draggable="${!st.checked}">${esc(it.t)}</button>`;
    };
    const pool = st.items.map((_, i) => i).filter(i => st.at[i] == null);
    const right = st.items.filter((it, i) => st.at[i] === it.c).length;
    p.innerHTML = `
      ${st.checked ? `<div class="panel row spread"><div><div class="score">${right} / ${st.items.length}</div><div class="muted">${right === st.items.length ? 'All sorted correctly.' : 'Red items are in the wrong group.'}</div></div>
        <div class="row">${right < st.items.length ? '<button class="btn" id="fix">Fix mistakes</button>' : ''}<button class="btn primary" id="again">Play again</button></div></div>${readinessPanel(set, st.before)}`
      : `<p class="muted">Sort each item into the right group. Tap an item and then a group, or drag it.</p>`}
      <div class="pool" id="pool">${pool.length ? pool.map(chip).join('') : `<span class="muted small">${st.checked ? '' : 'All items placed.'}</span>`}</div>
      <div class="buckets">${set.categories.map((c, ci) => `
        <div class="bucket ${st.sel != null ? 'target' : ''}" data-b="${ci}"><h3>${esc(c.name)}</h3>
          <div class="chips">${st.items.map((_, i) => i).filter(i => st.at[i] === ci).map(chip).join('')}</div></div>`).join('')}</div>
      ${st.checked ? '' : `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="check" ${pool.length ? 'disabled' : ''}>Check</button></div>`}`;

    $$('.chip', p).forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        if (st.checked) return;
        const i = +b.dataset.i;
        if (st.at[i] != null) { delete st.at[i]; st.sel = null; }
        else st.sel = st.sel === i ? null : i;
        draw();
      };
      b.ondragstart = e => { e.dataTransfer.setData('text/plain', b.dataset.i); };
    });
    $$('[data-b]', p).forEach(bk => {
      const place = i => { st.at[i] = +bk.dataset.b; st.sel = null; draw(); };
      bk.onclick = () => { if (st.sel != null && !st.checked) place(st.sel); };
      bk.ondragover = e => { if (!st.checked) { e.preventDefault(); bk.classList.add('over'); } };
      bk.ondragleave = () => bk.classList.remove('over');
      bk.ondrop = e => { e.preventDefault(); const i = e.dataTransfer.getData('text/plain'); if (i !== '') place(+i); };
    });
    const pl = $('#pool', p);
    pl.ondragover = e => { if (!st.checked) e.preventDefault(); };
    pl.ondrop = e => { e.preventDefault(); const i = e.dataTransfer.getData('text/plain'); if (i !== '') { delete st.at[+i]; draw(); } };
    if ($('#check', p)) $('#check', p).onclick = () => {
      st.checked = true;
      if (!st.scored) {
        st.scored = true; st.before = readiness(set);
        const frac = st.items.filter((it, i) => st.at[i] === it.c).length / st.items.length;
        const prev = set.catS == null ? null : fade(set.catS, set.catT, 14);
        set.catS = prev == null ? frac : +(prev + 0.5 * (frac - prev)).toFixed(3); set.catT = Date.now();
        saveSets(set);
      }
      draw();
    };
    if ($('#fix', p)) $('#fix', p).onclick = () => { st.items.forEach((it, i) => { if (st.at[i] !== it.c) delete st.at[i]; }); st.checked = false; draw(); };
    if ($('#again', p)) $('#again', p).onclick = () => { view.cat = null; paneCats(p, set); };
  };
  draw();
}

/* editor */
function paneEdit(p, set) {
  const draft = view.draft ||= JSON.parse(JSON.stringify(set));
  const catText = c => c.map(x => `${x.name}: ${x.items.join('; ')}`).join('\n');
  const draw = () => {
    p.innerHTML = `
      <div class="panel">
        <label class="field">Title <input type="text" id="eTitle" value="${esc(draft.title)}"></label>
        <label class="field">Folder <span class="muted small">(optional, like a class name)</span> <input type="text" id="eFolder" list="folderList" value="${esc(draft.folder || '')}" placeholder="e.g. Biology"></label>
        ${folderList()}
      </div>
      <div class="panel">
        <div class="row spread"><h2>Flashcards (${draft.cards.length})</h2><button class="btn sm" id="addTop">+ Add card</button></div>
        <div id="rows">${draft.cards.map((c, i) => `
          <div class="cardrow">
            <span class="num">${i + 1}</span>
            <textarea rows="2" data-f="term" data-i="${i}" placeholder="Term">${esc(c.term)}</textarea>
            <textarea rows="2" data-f="definition" data-i="${i}" placeholder="Definition">${esc(c.definition)}</textarea>
            <button class="btn ghost sm star ${c.star ? 'on' : ''}" data-star="${i}" aria-label="Star card" aria-pressed="${!!c.star}">${c.star ? '★' : '☆'}</button>
            <button class="btn ghost sm" data-rm="${i}" aria-label="Remove card">✕</button>
          </div>`).join('')}</div>
        <button class="btn sm" id="add">+ Add card</button>
      </div>
      <div class="panel">
        <h2>Categories</h2>
        <p class="muted small">One group per line: <code>Group name: item; item; item</code></p>
        <textarea id="eCats" rows="5" placeholder="Mammals: whale; bat; dog&#10;Reptiles: snake; turtle">${esc(catText(draft.categories))}</textarea>
      </div>
      <div class="panel">
        <div class="row spread"><h2>AI questions (${draft.questions.length})</h2></div>
        ${draft.questions.length ? draft.questions.map((q, i) => `
          <div class="row spread small" style="padding:8px 0;border-top:1px solid var(--line);flex-wrap:nowrap">
            <span>${esc(q.question)} <span class="muted">→ ${esc(answerText(q))}</span></span>
            <button class="btn ghost sm" data-rq="${i}" aria-label="Remove question">✕</button>
          </div>`).join('') : '<p class="muted small">None. Generate a set with AI to get written questions.</p>'}
      </div>
      <div class="row" style="justify-content:flex-end;position:sticky;bottom:12px">
        <button class="btn" id="discard">Discard changes</button>
        <button class="btn primary" id="save">Save</button>
      </div>`;
    $('#eTitle', p).oninput = e => draft.title = e.target.value;
    $('#eFolder', p).oninput = e => draft.folder = e.target.value;
    $$('[data-star]', p).forEach(b => b.onclick = () => { const c = draft.cards[+b.dataset.star]; c.star = !c.star; draw(); });
    $('#eCats', p).oninput = e => draft._cats = e.target.value;
    if (draft._cats != null) $('#eCats', p).value = draft._cats;
    $$('[data-f]', p).forEach(t => t.oninput = () => draft.cards[+t.dataset.i][t.dataset.f] = t.value);
    $$('[data-rm]', p).forEach(b => b.onclick = () => { draft.cards.splice(+b.dataset.rm, 1); draw(); });
    $$('[data-rq]', p).forEach(b => b.onclick = () => { draft.questions.splice(+b.dataset.rq, 1); draw(); });
    const add = top => { top ? draft.cards.unshift({ term: '', definition: '' }) : draft.cards.push({ term: '', definition: '' }); draw();
      const rows = $$('[data-f="term"]', p); (top ? rows[0] : rows[rows.length - 1]).focus(); };
    $('#add', p).onclick = () => add(false);
    $('#addTop', p).onclick = () => add(true);
    $('#discard', p).onclick = () => { view.draft = null; paneEdit(p, set); toast('Changes discarded'); };
    $('#save', p).onclick = () => {
      if (draft._cats != null) {
        draft.categories = draft._cats.split('\n').map(l => {
          const k = l.indexOf(':'); if (k < 0) return null;
          return { name: l.slice(0, k).trim(), items: l.slice(k + 1).split(';').map(s => s.trim()).filter(Boolean) };
        }).filter(Boolean);
      }
      const clean = normalizeSet(draft);
      Object.assign(set, clean, { id: set.id });
      saveSets(set); view.draft = null; view.fc = view.cat = view.match = view.test = view.learn = null;
      toast('Saved'); render();
    };
  };
  draw();
}

render();
initClaude();
</script>
